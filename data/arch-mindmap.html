<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>全景脑图 · 系统架构设计师综合知识（75题）</title>
<style>
:root{
  --bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--ink2:#475569;--sub:#64748b;
  --line:#e2e8f0;--canvas:#f1f5f9;--dot:#cbd5e1;
  --acc:#2563eb;--accbg:#eff6ff;
  --t1:#dc2626;--t1-bg:#fef2f2;--t1-bd:#fca5a5;
  --t2:#d97706;--t2-bg:#fffbeb;--t2-bd:#fcd34d;
  --t3:#64748b;--t3-bg:#f1f5f9;--t3-bd:#cbd5e1;
  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-bd:#86efac;
  --shadow:0 2px 6px rgba(15,23,42,.06);
  --shadow-lg:0 10px 30px rgba(15,23,42,.14);
}
html.dark{
  --bg:#0b1120;--card:#151f32;--ink:#f1f5f9;--ink2:#cbd5e1;--sub:#94a3b8;
  --line:#26344d;--canvas:#090e1a;--dot:#1e293b;
  --acc:#60a5fa;--accbg:#172554;
  --t1:#f87171;--t1-bg:#451a1a;--t1-bd:#7f1d1d;
  --t2:#fbbf24;--t2-bg:#42280e;--t2-bd:#78350f;
  --t3:#94a3b8;--t3-bg:#1e293b;--t3-bd:#334155;
  --ok:#4ade80;--ok-bg:#052e16;--ok-bd:#166534;
  --shadow:0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 12px 36px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ===== Top Toolbar ===== */
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:20;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap}
.nav-link{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:var(--accbg);color:var(--acc);font-size:12.5px;font-weight:700;border:1px solid transparent}
.nav-link:hover{border-color:var(--acc)}
.prog-wrap{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.prog-bar{width:64px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--ok);width:0;transition:width .25s}

.toolbar-group{display:inline-flex;align-items:center;gap:4px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tbtn{background:transparent;border:none;color:var(--ink2);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.tbtn:hover{color:var(--ink);background:rgba(148,163,184,.14)}
.tbtn.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tbtn.t1.on{color:var(--t1)}
.tbtn.t2.on{color:var(--t2)}

.search-box{position:relative;display:inline-flex;align-items:center}
#search{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12.5px;width:185px;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--acc)}
#hitinfo{font-size:12px;color:var(--acc);font-weight:700;margin-left:6px;white-space:nowrap}
.spacer{margin-left:auto}

/* ===== Main Workspace ===== */
.workspace{flex:1;position:relative;overflow:hidden;display:flex}

/* 1. Canvas View */
#viewport{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/22px 22px,var(--canvas);cursor:grab;touch-action:none}
#viewport.drag{cursor:grabbing}
#viewport.hidden{display:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.mm-node{position:absolute;left:0;top:0;background:var(--card);border:1.5px solid var(--line);border-left-width:4.5px;border-radius:10px;padding:7px 14px 7px 11px;max-width:300px;cursor:pointer;user-select:none;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.mm-node:hover{border-color:var(--acc);box-shadow:0 4px 14px rgba(37,99,235,.15)}
.mm-node.active{outline:2.5px solid var(--acc);outline-offset:1px}
.mm-node.hit{outline:2.5px solid #f59e0b;outline-offset:2px}
.mm-node.hidden-node{display:none}
.mm-node.root{background:linear-gradient(135deg,#1e3a8a,#312e81);color:#fff;border:none;padding:11px 18px;font-size:15px;font-weight:800;border-radius:12px;max-width:260px;box-shadow:0 6px 20px rgba(30,58,138,.32)}
.mm-node.tier-node{font-weight:800;font-size:13.5px;padding:8px 14px}
.mm-node.domain-node{font-weight:700;font-size:13.5px}
.mm-node.t1{border-left-color:var(--t1)}
.mm-node.t2{border-left-color:var(--t2)}
.mm-node.t3{border-left-color:var(--t3)}
.mm-node.done{border-color:var(--ok-bd);border-left-color:var(--ok);background:var(--ok-bg)}

.n-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.n-title{line-height:1.4}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap;line-height:1.45}
.b-t1{background:var(--t1-bg);color:var(--t1)}
.b-t2{background:var(--t2-bg);color:var(--t2)}
.b-t3{background:var(--t3-bg);color:var(--t3)}
.b-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.n-sub{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mm-node.root .n-sub{color:#c7d2fe}

.fold-btn{position:absolute;right:-11px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink2);font-size:11px;font-weight:700;line-height:17px;text-align:center;padding:0 5px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);z-index:2}
.fold-btn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-50%) scale(1.08)}

/* Floating Canvas Controls */
.canvas-hud{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px;box-shadow:var(--shadow);z-index:10;font-size:12px}
.canvas-hud.hidden{display:none}
.hud-tip{color:var(--sub);padding:0 6px;border-left:1px solid var(--line)}

/* 2. Outline Card View (Mobile & Reading Friendly) */
#outlineView{flex:1;overflow-y:auto;padding:18px;display:none}
#outlineView.show{display:block}
.ol-container{max-width:960px;margin:0 auto}
.strategy-banner{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow);font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.strategy-banner b{color:var(--ink)}
.ol-tier{margin-bottom:22px}
.ol-tier-hd{font-size:15.5px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ol-domains{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ol-domain{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ol-domain summary{padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent}
.ol-domain summary::-webkit-details-marker{display:none}
.ol-domain[open] summary{border-bottom-color:var(--line);background:rgba(148,163,184,.05)}
.ol-domain summary::after{content:"▾";margin-left:auto;color:var(--sub);transition:.15s}
.ol-domain[open] summary::after{transform:rotate(180deg)}
.ol-leaves{padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.ol-leaf{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;transition:.15s}
.ol-leaf:hover{border-color:var(--acc)}
.ol-leaf.done{background:var(--ok-bg);border-color:var(--ok-bd)}
.ol-leaf.hit{outline:2px solid #f59e0b}
.ol-leaf-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;font-size:13.5px}
.ol-leaf-key{font-size:12px;color:var(--sub);margin-top:3px}

/* ===== Right / Bottom Detail Drawer ===== */
#drawer{width:380px;max-width:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:15;display:none;flex-direction:column;overflow:hidden}
#drawer.open{display:flex}
.dw-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dw-path{font-size:11.5px;color:var(--sub);margin-bottom:4px}
.dw-title{font-size:16.5px;font-weight:800;line-height:1.35;margin:0}
.dw-close{background:var(--bg);border:1px solid var(--line);color:var(--ink2);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;flex:none}
.dw-body{padding:14px 16px;overflow-y:auto;flex:1;font-size:13.5px;line-height:1.75}
.dw-keybox{background:var(--accbg);border-left:3.5px solid var(--acc);padding:9px 12px;border-radius:8px;margin:10px 0 14px;font-size:13px;color:var(--ink)}
.dw-sec{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
.dw-points{margin:0;padding-left:18px}
.dw-points li{margin:6px 0;color:var(--ink)}
.dw-points li b{color:var(--acc)}
html.dark .dw-points li b{color:#93c5fd}
.dw-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--bg)}
.done-btn{flex:1;padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s}
.done-btn.is-done{background:var(--ok);border-color:var(--ok);color:#fff}
.step-btn{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;font-weight:600;font-size:12.5px}
.step-btn:hover{border-color:var(--acc);color:var(--acc)}

@media(max-width:820px){
  header{padding:8px 10px;gap:6px}
  #search{width:135px}
  .hud-tip{display:none}
  #drawer{position:fixed;left:0;right:0;bottom:0;width:100%;max-height:74vh;border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <a class="nav-link" href="index.html">← 手册首页</a>
    <span>🧠 选择题知识点全景脑图</span>
  </div>

  <div class="prog-wrap" title="点击任意考点打开精讲并标记已掌握，进度保存在本地浏览器">
    <span>掌握</span>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <strong id="progText">0/0</strong>
  </div>

  <div class="toolbar-group" role="tablist" aria-label="视图模式">
    <button class="tbtn on" id="modeCanvas" onclick="setViewMode('canvas')">🕸️ 脑图画布</button>
    <button class="tbtn" id="modeOutline" onclick="setViewMode('outline')">📋 大纲卡片</button>
  </div>

  <div class="toolbar-group" id="levelGroup">
    <button class="tbtn" data-lv="1">到档位</button>
    <button class="tbtn on" data-lv="2">到知识域</button>
    <button class="tbtn" data-lv="3">全展开</button>
  </div>

  <div class="toolbar-group" id="filterGroup">
    <button class="tbtn on" data-f="all">全部</button>
    <button class="tbtn t1" data-f="1">🔥 一档核心</button>
    <button class="tbtn t2" data-f="2">⚡ 二档套路</button>
    <button class="tbtn" data-f="todo">未掌握</button>
  </div>

  <div class="search-box">
    <input id="search" type="search" placeholder="搜索考点/口诀（/ 聚焦）">
    <span id="hitinfo"></span>
  </div>

  <div class="spacer"></div>
  <a class="nav-link" href="core-knowledge.html">★5 背诵卡</a>
  <button class="tbtn" style="border:1px solid var(--line);background:var(--bg)" onclick="toggleTheme()" title="切换日间/夜间模式">◐ 夜间</button>
</header>

<div class="workspace">
  <!-- 1. Interactive Mindmap Canvas -->
  <div id="viewport">
    <div id="world"><svg id="links"></svg></div>
    <div class="canvas-hud" id="canvasHud">
      <button class="tbtn" onclick="zoomBy(1.22)" title="放大">＋</button>
      <span id="zoomPct" style="min-width:42px;text-align:center;font-weight:700;color:var(--ink2)">100%</span>
      <button class="tbtn" onclick="zoomBy(1/1.22)" title="缩小">－</button>
      <button class="tbtn" onclick="fitView()" title="居中适配屏幕">适配</button>
      <span class="hud-tip">拖拽平移 · 滚轮缩放 · 点击节点看精讲与秒杀口诀 · 右侧圆点展开/收起</span>
    </div>
  </div>

  <!-- 2. Mobile-Friendly Outline Tree -->
  <div id="outlineView">
    <div class="ol-container" id="outlineBody"></div>
  </div>

  <!-- 3. Knowledge Point Detail Drawer -->
  <aside id="drawer" aria-label="考点精讲面板">
    <div class="dw-head">
      <div>
        <div class="dw-path" id="dwPath"></div>
        <h2 class="dw-title" id="dwTitle"></h2>
      </div>
      <button class="dw-close" onclick="closeDrawer()" title="关闭 (Esc)">✕</button>
    </div>
    <div class="dw-body" id="dwBody"></div>
    <div class="dw-foot">
      <button class="step-btn" onclick="stepLeaf(-1)">← 上一考点</button>
      <button class="done-btn" id="dwDoneBtn" onclick="toggleCurrentDone()">✓ 标记已掌握</button>
      <button class="step-btn" onclick="stepLeaf(1)">下一考点 →</button>
    </div>
  </aside>
</div>

<script>
/* ============================================================================
   数据源：软考系统架构设计师 · 综合知识（75题）三档 × 16 大知识域 × 52 核心考点
   考频基线：2013–2026 真题域级聚合 & 机考后（5卷）每卷均值与命题趋势
   ============================================================================ */
const TREE_DATA = {
  id: "root",
  title: "系统架构设计师 · 综合知识",
  badge: "75题 · 45分及格",
  sub: "点击任意节点查看考频、题眼口诀与必背公式",
  key: "机考得分模型：一档拿 40/48.2 + 二档拿 6.5/14.4 ≈ 46.5 分稳过线！把 70% 精力砸在一档架构与核心域。",
  points: [
    "<b>考试规格</b>：75 道单选题 × 1 分，150 分钟（单题 ≤ 2 分钟，计算题超 3 分钟先标记跳过）。",
    "<b>机考三大趋势</b>：① 系统架构设计暴涨至 <b>19.8 题/卷（占 30.6%）</b>；② 软件测试（+70%）、信息安全、可靠性明显升温；③ 传统组成原理细节与运行维护持续萎缩。",
    "<b>一鱼三吃策略</b>：架构风格、质量属性、ATAM 评估、微服务/缓存与下午案例及论文第 2 问高度同源，优先吃透！"
  ],
  children: [
    {
      id: "tier-1",
      tier: 1,
      isTier: true,
      title: "第一档 · 核心必拿区",
      badge: "≈48.2分/卷",
      sub: "投入 70% 时间 · 目标拿 40+ 分",
      key: "涵盖机考分值最高的 7 大知识域，且与案例分析、论文理论段直接复用。",
      points: [
        "<b>系统架构设计（19.8分）</b>单域占全卷近 1/3，边际收益全场最高。",
        "<b>软工 + 系统分析设计（11.0分）</b>题型固定，开发模型、UML、设计模式必考。",
        "<b>OS + 测试 + 安全 + 数据库（17.4分）</b>全部是强套路题（PV、McCabe、公私钥签名、范式分解），掌握规则即可稳拿。"
      ],
      children: [
        {
          id: "d-arch", tier: 1, title: "1. 系统架构设计", badge: "19.8题/卷 ↑↑", sub: "全卷第一大域（机考暴涨+61%）",
          key: "架构五件套（风格 + 质量属性 + 评估 + CBSE + ABSD/DSSA）合计占全卷 16.6% 以上。",
          points: ["机考后平均每卷约 20 题，是决定综合知识能否过线的绝对胜负手。","所有概念同时服务于下午案例第 1 题与论文第 2 问理论段。"],
          children: [
            { id: "kp-arch-style", tier: 1, title: "软件架构风格判别", badge: "考频Top1 · 45题",
              key: "看题干关键词秒选风格：流式增量=管道过滤器，隐式广播=事件驱动，插件内核=微内核，专家语音=黑板。",
              points: [
                "<b>数据流风格</b>：批处理（整体顺序、无交互）vs <b>管道-过滤器</b>（流式单向、高复用并发，如编译器、Unix 管道）。",
                "<b>调用/返回风格</b>：主程序/子程序、面向对象、<b>分层架构</b>（层间单向调用，越层调用破坏可修改性，注意污水池反模式）。",
                "<b>独立构件风格</b>：进程通信 vs <b>事件驱动/隐式调用</b>（发布-订阅解耦，响应顺序不可控、调试较难）。",
                "<b>以数据为中心</b>：仓库（中央数据库被动受访）vs <b>黑板</b>（中央数据主动触发多知识源协作，典型：语音识别、模式识别、专家系统）。",
                "<b>虚拟机风格</b>：解释器（自定义脚本/业务规则引擎，灵活但性能低）、规则系统；<b>微内核</b>（核心最小化+插件扩展，如 OS、Eclipse、浏览器）。"
              ]
            },
            { id: "kp-arch-qa", tier: 1, title: "质量属性与场景六元组", badge: "考频Top2 · 31题",
              key: "响应时间/吞吐→性能；故障恢复/冗余→可用性；局部变更低波及→可修改性；审计防抵赖→安全性。",
              points: [
                "<b>质量属性场景六元组</b>：刺激源 → 刺激 → 环境 → 制品 → 响应 → <b>响应度量</b>（常考：必须可量化才算完整度量，如“2秒内返回”）。",
                "<b>可用性战术</b>：错误检测（心跳/Ping-Echo/异常）→ 错误恢复（主备冗余/主动冗余/回滚/降级）→ 错误预防。",
                "<b>性能战术</b>：资源需求（提高算法效率/减少开销）+ 资源管理（并发/多级缓存/读写分离）+ 资源仲裁（调度/负载均衡）。",
                "<b>可修改性战术</b>：局部化变更（高内聚/语义一致性）、防止连锁反应（信息隐藏/接口与实现分离/中介者）、推迟绑定时间（配置化/插件）。",
                "<b>可测试性战术</b>：输入输出捕获（录制回放）、内置监控与断言、接口实现分离（便于 Mock）。"
              ]

/* ============================================================================
   树索引构建 & 本地掌握状态
   ============================================================================ */
const STORAGE_DONE = "studyhub_mcq_mm_done";
let doneSet = new Set();
try { doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_DONE) || "[]")); } catch(e) {}

const allNodes = [];
const leafNodes = [];
const nodeById = {};

(function indexTree(n, parent, depth) {
  n.parent = parent;
  n.depth = depth;
  n.children = n.children || [];
  n.isRoot = depth === 0;
  n.isLeaf = n.children.length === 0;
  // Default collapse depth >= 2 (domains show, leaves collapsed initially for super clean overview!)
  n.collapsed = depth >= 2 && n.children.length > 0;
  n.rendered = true;
  n.x = 0; n.y = 0; n.w = 0; n.h = 0;
  nodeById[n.id] = n;
  allNodes.push(n);
  if (n.isLeaf && !n.isRoot) leafNodes.push(n);
  n.children.forEach(c => indexTree(c, n, depth + 1));
})(TREE_DATA, null, 0);

function saveDone() {
  localStorage.setItem(STORAGE_DONE, JSON.stringify([...doneSet]));
  updateProgressUI();
}

function isNodeDone(n) {
  if (n.isLeaf) return doneSet.has(n.id);
  return n.children.length > 0 && n.children.every(isNodeDone);
}

function updateProgressUI() {
  const doneCount = leafNodes.filter(n => doneSet.has(n.id)).length;
  const total = leafNodes.length;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("progText").textContent = `${doneCount}/${total}`;
  allNodes.forEach(n => {
    if (n.el) n.el.classList.toggle("done", !n.isRoot && isNodeDone(n));
    if (n.olEl) n.olEl.classList.toggle("done", doneSet.has(n.id));
  });
  if (currentNode) syncDrawerDoneBtn();
}

function tierBadgeClass(t) { return t === 1 ? "b-t1" : t === 2 ? "b-t2" : "b-t3"; }

function countDescendants(n) {

/* ============================================================================
   过滤与画布 Tidy-Tree 布局算法
   ============================================================================ */
let filterMode = "all";
let viewMode = window.innerWidth < 768 ? "outline" : "canvas";

function passesFilter(n) {
  if (filterMode === "all") return true;
  if (filterMode === "1") return n.tier === 1;
  if (filterMode === "2") return n.tier === 2;
  if (filterMode === "todo") return n.isLeaf && !doneSet.has(n.id);
  return true;
}

function filterPassSubtree(n) {
  if (n.isLeaf) return passesFilter(n);
  return n.children.some(filterPassSubtree);
}

function computeVisibility(n, ancCollapsed) {
  let anyChildRendered = false;
  n.children.forEach(c => {
    computeVisibility(c, ancCollapsed || n.collapsed);
    if (c.rendered) anyChildRendered = true;
  });
  const selfOk = n.isRoot || (n.isLeaf ? passesFilter(n) : anyChildRendered || (filterMode !== "todo" && passesFilter(n) && n.collapsed && filterPassSubtree(n)));
  n.rendered = !ancCollapsed && selfOk;
  n._visKids = n.children.filter(c => c.rendered);
}

const HGAP = 56, VGAP = 14;

function measureNodes() {
  const prevT = world.style.transform;
  world.style.transform = "none";
  allNodes.forEach(n => {
    if (!n.rendered) return;
    n.el.classList.remove("hidden-node");
    n.w = n.el.offsetWidth || 200;
    n.h = n.el.offsetHeight || 38;
  });
  world.style.transform = prevT;
}

function renderCanvas() {
  computeVisibility(TREE_DATA, false);
  allNodes.forEach(n => n.el.classList.toggle("hidden-node", !n.rendered));
  measureNodes();

  const vis = allNodes.filter(n => n.rendered);
  const colW = {};
  vis.forEach(n => { colW[n.depth] = Math.max(colW[n.depth] || 0, n.w); });
  const colX = {};
  let xAcc = 40;
  Object.keys(colW).map(Number).sort((a, b) => a - b).forEach(d => {
    colX[d] = xAcc;
    xAcc += colW[d] + HGAP;
  });

  let yCursor = 40;
  function shiftY(n, dy) { n.y += dy; n._visKids.forEach(k => shiftY(k, dy)); }
  function place(n) {
    if (n._visKids.length === 0) {
      n.y = yCursor + n.h / 2;
      yCursor += n.h + VGAP;
    } else {
      const topStart = yCursor;
      n._visKids.forEach(place);
      const span = yCursor - VGAP - topStart;
      if (n.h > span) {
        const pad = (n.h - span) / 2;
        n._visKids.forEach(k => shiftY(k, pad));
        yCursor = topStart + n.h + VGAP;
      }
      n.y = (n._visKids[0].y + n._visKids[n._visKids.length - 1].y) / 2;
    }
    n.x = colX[n.depth];
  }
  place(TREE_DATA);

  let maxX = 0, maxY = 0;
  vis.forEach(n => {
    n.el.style.transform = `translate(${n.x}px,${n.y - n.h / 2}px)`;
    if (n.foldEl) {
      const hiddenKids = n._visKids.length === 0 && n.children.length > 0;
      n.foldEl.textContent = hiddenKids ? countDescendants(n) : "−";
    }
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + n.h / 2);
  });

  const paths = { 1: "", 2: "", 3: "" };
  vis.forEach(n => {
    n._visKids.forEach(c => {
      const x1 = n.x + n.w, y1 = n.y, x2 = c.x, y2 = c.y;
      const mx = x1 + (x2 - x1) * 0.5;
      paths[c.tier || 1] += `M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2} `;
    });
  });

  svg.setAttribute("width", maxX + 80);
  svg.setAttribute("height", maxY + 80);
  svg.innerHTML =
    `<path d="${paths[3]}" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-opacity=".55"/>` +
    `<path d="${paths[2]}" fill="none" stroke="#d97706" stroke-width="1.8" stroke-opacity=".65"/>` +
    `<path d="${paths[1]}" fill="none" stroke="#dc2626" stroke-width="2.1" stroke-opacity=".7"/>`;

  world.style.width = (maxX + 80) + "px";
  world.style.height = (maxY + 80) + "px";
  updateProgressUI();
}

/* ============================================================================
   平移、滚轮缩放与移动端双指捏合缩放
   ============================================================================ */
let scale = 1, tx = 40, ty = 40;

function applyTransform() {
  world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  const zp = document.getElementById("zoomPct");
  if (zp) zp.textContent = Math.round(scale * 100) + "%";
}

function fitView() {
  const vis = allNodes.filter(n => n.rendered);
  if (!vis.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  vis.forEach(n => {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y - n.h / 2);
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + n.h / 2);
  });
  const vw = viewport.clientWidth || window.innerWidth;
  const vh = viewport.clientHeight || (window.innerHeight - 56);
  const bw = maxX - minX + 80;
  const bh = maxY - minY + 80;
  scale = Math.max(0.35, Math.min(1.15, Math.min(vw / bw, vh / bh)));
  tx = (vw - (maxX - minX) * scale) / 2 - minX * scale;
  ty = (vh - (maxY - minY) * scale) / 2 - minY * scale;
  applyTransform();
}

function zoomAt(factor, cx, cy) {
  const ns = Math.max(0.25, Math.min(2.4, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}

function zoomBy(factor) {
  zoomAt(factor, viewport.clientWidth / 2, viewport.clientHeight / 2);
}

function focusNodeOnCanvas(n) {
  // Expand ancestors if collapsed
  let p = n.parent;
  let changed = false;
  while (p) {
    if (p.collapsed) { p.collapsed = false; changed = true; }
    p = p.parent;
  }
  if (changed) renderCanvas();
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.max(scale, 0.92);
  tx = vw * 0.42 - (n.x + n.w / 2) * scale;
  ty = vh * 0.48 - n.y * scale;
  applyTransform();
}

// Mouse / Single-Finger Pan + Two-Finger Pinch Zoom
const pointers = new Map();
let lastPinchDist = 0;

viewport.addEventListener("pointerdown", e => {
  if (e.target.closest(".mm-node") || e.target.closest(".canvas-hud")) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  viewport.setPointerCapture(e.pointerId);
  viewport.classList.add("drag");
});

viewport.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = { x: e.clientX, y: e.clientY };
  pointers.set(e.pointerId, cur);

  if (pointers.size === 1) {
    tx += cur.x - prev.x;
    ty += cur.y - prev.y;
    applyTransform();
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const rect = viewport.getBoundingClientRect();
    const mx = (pts[0].x + pts[1].x) / 2 - rect.left;
    const my = (pts[0].y + pts[1].y) / 2 - rect.top;
    if (lastPinchDist > 0 && dist > 0) zoomAt(dist / lastPinchDist, mx, my);
    lastPinchDist = dist;
  }
});

function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) lastPinchDist = 0;
  if (pointers.size === 0) viewport.classList.remove("drag");
}
viewport.addEventListener("pointerup", releasePointer);
viewport.addEventListener("pointercancel", releasePointer);

viewport.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

  if (n.children && n.children.length) {
    body += `<div class="dw-sec">下属子模块（点击直达）</div><div style="display:flex;flex-direction:column;gap:6px">` +
      n.children.map(c => `<div onclick="openDrawerById('${c.id}')" style="padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px"><span>${c.title}</span><span class="badge ${tierBadgeClass(c.tier)}">${c.badge || '查看 →'}</span></div>`).join("") +
      `</div>`;
  }

  document.getElementById("dwBody").innerHTML = body;
  document.getElementById("drawer").classList.add("open");
  syncDrawerDoneBtn();
}

function syncDrawerDoneBtn() {
  const btn = document.getElementById("dwDoneBtn");
  if (!currentNode) return;
  if (!currentNode.isLeaf) {
    const doneKids = countLeafDone(currentNode);
    btn.className = "done-btn" + (doneKids.done === doneKids.total ? " is-done" : "");
    btn.textContent = doneKids.done === doneKids.total
      ? `✓ 本组全部已掌握 (${doneKids.done}/${doneKids.total})`
      : `一键标记本组已掌握 (${doneKids.done}/${doneKids.total})`;
    return;
  }
  const done = doneSet.has(currentNode.id);
  btn.className = "done-btn" + (done ? " is-done" : "");
  btn.textContent = done ? "✓ 已掌握（点击取消）" : "✓ 标记为已掌握";
}

function countLeafDone(n) {
  let total = 0, done = 0;
  (function walk(x) {
    if (x.isLeaf) { total++; if (doneSet.has(x.id)) done++; }
    x.children.forEach(walk);
  })(n);
  return { total, done };
}

function toggleCurrentDone() {
  if (!currentNode) return;
  if (currentNode.isLeaf) {
    if (doneSet.has(currentNode.id)) doneSet.delete(currentNode.id);
    else doneSet.add(currentNode.id);
  } else {
    const stats = countLeafDone(currentNode);
    const markAll = stats.done < stats.total;
    (function walk(x) {
      if (x.isLeaf) { if (markAll) doneSet.add(x.id); else doneSet.delete(x.id); }
      x.children.forEach(walk);
    })(currentNode);
  }
  saveDone();
  if (filterMode === "todo") refreshCurrentView();
}

function stepLeaf(delta) {
  if (!leafNodes.length) return;
  let idx = currentNode && currentNode.isLeaf ? leafNodes.indexOf(currentNode) : -1;
  idx = (idx + delta + leafNodes.length) % leafNodes.length;
  const target = leafNodes[idx];
  openDrawer(target);
  if (viewMode === "canvas") focusNodeOnCanvas(target);
  else if (target.olEl) target.olEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  allNodes.forEach(x => x.el && x.el.classList.remove("active"));
}

/* ============================================================================
   视图切换、层级控制与搜索跳转
   ============================================================================ */
function setViewMode(mode) {
  viewMode = mode;
  document.getElementById("modeCanvas").classList.toggle("on", mode === "canvas");
  document.getElementById("modeOutline").classList.toggle("on", mode === "outline");
  viewport.classList.toggle("hidden", mode !== "canvas");
  document.getElementById("outlineView").classList.toggle("show", mode === "outline");
  document.getElementById("levelGroup").style.display = mode === "canvas" ? "" : "none";
  refreshCurrentView(true);
}

function refreshCurrentView(shouldFit) {
  if (viewMode === "canvas") {
    renderCanvas();
    if (shouldFit) fitView();
  } else {
    buildOutlineView();
    updateProgressUI();
  }
}

document.querySelectorAll("#levelGroup .tbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#levelGroup .tbtn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    const lv = Number(btn.dataset.lv);
    allNodes.forEach(n => {
      if (!n.isRoot && n.children.length > 0) n.collapsed = n.depth >= lv;
    });
    renderCanvas();
    fitView();
  });
});

document.querySelectorAll("#filterGroup .tbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#filterGroup .tbtn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    filterMode = btn.dataset.f;
    if (filterMode !== "all") {
      // Filtering expands domains so matching leaves are immediately visible
      allNodes.forEach(n => { if (n.depth <= 2) n.collapsed = false; });
    }
    refreshCurrentView(true);
  });
});

// Instant Search (matches title + key + points!)
const searchInput = document.getElementById("search");
const hitInfo = document.getElementById("hitinfo");
let hits = [], hitIdx = 0;

function runSearch() {
  const q = searchInput.value.trim().toLowerCase();
  allNodes.forEach(n => {
    if (n.el) n.el.classList.remove("hit");
    if (n.olEl) n.olEl.classList.remove("hit");
  });
  hits = []; hitIdx = 0;
  if (!q) { hitInfo.textContent = ""; return; }

  hits = allNodes.filter(n => !n.isRoot && (
    n.title.toLowerCase().includes(q) ||
    (n.key && n.key.toLowerCase().includes(q)) ||
    (n.points && n.points.some(p => p.toLowerCase().includes(q)))
  ));

  if (!hits.length) { hitInfo.textContent = "无匹配"; return; }

  hits.forEach(n => {
    let p = n.parent;
    while (p) { p.collapsed = false; p = p.parent; }
  });
  if (viewMode === "canvas") renderCanvas();
  hits.forEach(n => {
    if (n.el) n.el.classList.add("hit");
    if (n.olEl) n.olEl.classList.add("hit");
  });
  jumpToHit(0);
}

function jumpToHit(i) {
  if (!hits.length) return;
  hitIdx = (i + hits.length) % hits.length;
  const target = hits[hitIdx];
  hitInfo.textContent = `${hitIdx + 1}/${hits.length}`;
  openDrawer(target);
  if (viewMode === "canvas") focusNodeOnCanvas(target);
  else if (target.olEl) target.olEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

searchInput.addEventListener("input", runSearch);
searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && hits.length) { e.preventDefault(); jumpToHit(hitIdx + 1); }
});

window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === "Escape") {
    closeDrawer();
  }
});

/* ============================================================================
   主题同步与初始化
   ============================================================================ */
function toggleTheme() {
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("studyhub_docs_dark", document.documentElement.classList.contains("dark") ? "1" : "0");
}
if (localStorage.getItem("studyhub_docs_dark") === "1") {
  document.documentElement.classList.add("dark");
}

window.addEventListener("resize", () => {
  if (viewMode === "canvas") fitView();
});

// Initial boot
setViewMode(viewMode);
</script>

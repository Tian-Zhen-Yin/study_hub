<script>
/* ============ 卡片数据：六个分组（按 ★★★★★ 小节提炼，术语遵原书） ============ */
var GROUPS={};
/*__G1__*/
GROUPS.g1={name:"软工·需求",chapters:[
{n:"第1章 软件工程",blocks:[
{id:"1-01",p:15,t:"软件工程三组成与 PDCA",c:"三组成：方法、工具、过程 → PDCA 四步各一句话",
x:`软件工程由方法、工具和过程三个部分组成。PDCA 四方面：（1）P（Plan）——软件规格说明，规定软件的功能及其运行时的限制；（2）D（Do）——软件开发，开发出满足规格说明的软件；（3）C（Check）——软件确认，确认开发的软件能够满足用户的需求；（4）A（Action）——软件演进，软件在运行过程中不断改进以满足客户新的需求。`,
b:["方法、工具和过程","规格说明","软件确认","软件演进"]},
{id:"1-02",p:21,t:"软件开发方法分类口诀",c:"口诀六字＝六类开发方法；功能级/领域级不单独展开",
x:`软件开发方法分类口诀"世仇结分工龄"（世仇结婚还要计算工龄）：世（实现）仇（抽象信息）结（结构）分（程序分量）工（功能级）龄（领域级）。功能级和领域级包含的信息就是功能和领域，所以不单独展开。`,
b:["世仇结分工龄","功能级","领域级"]},
{id:"1-03",p:22,t:"CBSE 与构件的定义",c:"23年架构选择题至少5分；构件≠孤立程序文件≠普通模块",
x:`基于构件的软件工程（CBSE）旨在通过复用可重用的软件构件来构造高质量、高效率的应用软件系统：将系统分解为独立的构件，每个构件都具有明确定义的功能和接口，可以独立开发、测试和部署。Ivar Jacobson 在1993年将构件描述为"已经实现、用于增强编程语言构造的单元"。构件由若干粒度更小的原子构件组成，原子构件之间逻辑关联强、部署依赖紧，需作为一个整体同时部署。`,
b:["CBSE","独立开发、测试和部署","1993年","原子构件"]},
{id:"1-04",p:23,t:"构件特性三件套（萨默维尔）",c:"可组装／可部署／文档化——接口、二进制、语法语义是采分点",
x:`构件特性：①可组装性——所有外部交互必须通过公开定义的接口进行，并提供对自身信息的外部访问（方法和属性）；②可部署性——构件需自包含，作为独立实体在提供其构件模型实现的平台上运行，因而构件总是二进制形式的且无须在部署前编译；③文档化——构件必须完全文档化，定义所有构件接口的语法甚至语义，使用户能确定构件是否满足需要。`,
b:["可组装性","可部署性","二进制形式","无须在部署前编译","文档化"]},
{id:"1-05",p:24,t:"生命周期模型＝软件过程＋选型前提",c:"软件过程＝生命周期模型（同义词）；三行前提表",
x:`软件过程＝软件开发生命周期模型，二者是同义词。软件生命周期：软件定义→软件开发→软件运行→软件维护，直至被淘汰。模型选型：需求完全确定→瀑布模型；初始阶段仅能提供基本需求→喷泉模型、螺旋模型、统一开发过程、敏捷方法；以形式化开发方法为基础→变换模型。`,
b:["同义词","瀑布模型","基本需求","形式化","变换模型"]},
{id:"1-06",p:25,t:"瀑布模型",c:"1970 / 6 阶段 / 不会考原图，关键背缺点",
x:`瀑布模型由 Winston W. Royce 在1970年提出，将软件开发分为需求分析和定义、系统和软件设计、实现和单元测试、集成和系统测试、运行维护6个阶段，形如瀑布流水。缺点：依赖于早期进行的需求调查，不能适应需求的变化；软件需求的完整性、正确性等很难确定，甚至是不可能和不现实的。`,
b:["1970年","6个阶段","不能适应需求的变化","不现实的"]},
{id:"1-07",p:25,t:"原型／演化／快速原型模型",c:"软考不做区分当一个东西；与增量的区分点＝迭代",
x:`原型模型/演化模型/快速原型模型软考里不做区分：适用于事先需求难完整定义的软件开发，基于快速开发的原型，依据用户反馈改进，不断迭代直至形成最终产品。优点：功能开发后可及时测试以验证需求，有助于产生高质量需求；缺点：若让用户过早接触不稳定功能，可能对开发人员和用户造成负面影响。原型的特点是迭代。`,
b:["需求难完整定义","用户反馈","迭代"]},
{id:"1-08",p:26,t:"螺旋模型",c:"等式必背：螺旋＝快速原型＋风险分析",
x:`螺旋模型＝快速原型＋风险分析（选择题特别爱考），在快速原型的基础上扩展而成。使软件增量版本可快速开发，以一系列增量发布的形式进行；特别适用于庞大、复杂并具有高风险的系统，支持用户需求的动态变化；缺点是过多的迭代次数会增加开发成本，延迟提交时间。`,
b:["快速原型","风险分析","高风险","增量发布","延迟提交时间"]},
{id:"1-09",p:27,t:"V 模型与四类测试依据",c:"易错：概要设计是集成测试的依据（不是系统测试！）",
x:`V模型考点：概要设计的产物是集成测试的依据（集成测试人员根据概要接口定义设计测试用例），系统测试的依据是需求分析文档或开发合同，验收测试的依据是用户需求。四类测试：单元测试——对象为可独立编译的模块/构件/类，依据软件详细设计说明书；集成测试——检查模块间及模块与已集成软件间的接口，依据软件概要设计文档；系统测试——真实工作环境下验证完整系统，依据需求分析；验收测试——用户角度验证满足合同或需求规定的业务目标。`,
b:["集成测试","用户需求","详细设计","概要设计","需求分析"]},
{id:"1-10",p:29,t:"RUP 概述三特征",c:"用例驱动／以体系结构为中心／迭代增量；4+1 有三种注意区分",
x:`RUP（Rational Unified Process）将项目管理、业务建模、分析与设计等统一起来，贯穿整个开发过程。RUP 是用例驱动的、以体系结构为中心的、迭代和增量的软件开发过程；开发活动围绕体系结构展开，软件体系结构的设计与代码设计无关、不依赖于具体的程序设计语言；采用"4+1"视图模型描述软件系统的体系结构。注意软考里共有3种4+1视图，需区分出处。`,
b:["用例驱动","以体系结构为中心","迭代和增量","4+1"]},
{id:"1-11",p:29,t:"RUP 九大核心工作流",c:"两句口诀拆出全部九流；23年系分直接考",
x:`RUP 软件开发生命周期是二维的软件开发模型，包含9个核心工作流：业务建模、需求、分析与设计、实现、测试、部署、配置与变更管理、项目管理、环境。口诀"建需分食测"（建仓前需先分好粮食、测好食物够不够）——建（建模）需（需求）分（分析）食（实现）测（测试）；"部配变项环"（部门配了新工具遇情况得变步骤、项目每个环节盯牢）——部（部署）配变（配置变更）项（项目管理）环（环境）。`,
b:["二维","9个","业务建模","配置与变更管理","环境","建需分食测","部配变项环"]},
{id:"1-12",p:30,t:"敏捷宣言与适用场景",c:"四个'胜过'逐字背；适用口诀：小变",
x:`敏捷宣言：个体和交互胜过过程和工具；可工作的软件胜过大量的文档；客户合作胜过合同谈判；响应变化胜过遵循计划。敏捷方法是适应型而非可预测型，以人为本而非以过程为本，是迭代增量式的开发过程。适用场景：规模较小的项目；需求初步萌芽、尚未明确定型并且快速改变的情况。若系统有较高的关键性、可靠性、安全性要求，则可能不完全适合。口诀：小变（规模小、快速改变）。`,
b:["个体和交互","可工作的软件","客户合作","响应变化","规模较小","快速改变"]},
{id:"1-13",p:30,t:"主要敏捷方法四个",c:"四方法各记一个标签：XP价值观／水晶人中心／Scrum管项目／FDD三要素",
x:`常见敏捷方法：极限编程（XP）——轻量级、灵巧且严谨周密，强调通过短开发周期和频繁发布提高质量，核心价值观为交流、朴素、反馈、勇气，遵循 YAGNI 和 DRY 原则；水晶系列方法——以人为中心，提倡"机动性的"方法；Scrum——侧重于项目管理的迭代式增量软件开发过程；特征驱动开发（FDD）——迭代的开发模型，强调人、过程和技术三要素。`,
b:["极限编程","交流、朴素、反馈、勇气","YAGNI","DRY","以人为中心","项目管理","三要素"]},
{id:"1-14",p:31,t:"Scrum 三角色（次重点但高频）",c:"PO 管价值与 Backlog／SM 推框架清障碍／开发团队交付",
x:`Scrum 是用于指导团队协作、迭代交付的敏捷框架，强调经验驱动：透明的信息、频繁的检查、及时的调整。三类核心角色：产品负责人（Product Owner）——业务价值代言人，代表客户与利益相关者传递需求，管理并按优先级排序产品需求列表（Product Backlog）；敏捷教练（Scrum Master）——Scrum 方法推动者与障碍清除者，确保团队理解并遵循 Scrum 原则、识别并清除工作障碍；开发团队（Developers）——执行迭代交付。`,
b:["经验驱动","Product Owner","Product Backlog","Scrum Master"]}
]},
{n:"第2章 需求工程",blocks:[
{id:"2-01",p:36,t:"需求工程定义与核心问题",c:"创建和维护需求文档的一切活动；解决'做什么'而非'怎么做'",
x:`软件需求工程是包括创建和维护软件需求文档所必需的一切活动的过程。它不是简单地"收集需求"或"编写需求文档"，核心问题是：在不确定性极高的早期阶段，将多方模糊甚至相互冲突的期望，逐步转化为清晰、可验证、可交付的系统需求。需求工程解决的不是"系统如何实现"，而是"系统是否值得实现、应该实现什么、以及做到什么程度"。`,
b:["一切活动","清晰、可验证、可交付"]},
{id:"2-02",p:38,t:"结构化分析三模型",c:"核心＝数据字典；三模型：ER／DFD／状态转换图",
x:`结构化分析方法的基本思想是自顶向下、逐层分解。分析模型的核心是数据字典，围绕这个核心有三个层次的模型：数据模型（ER图）、功能模型（DFD图）和行为模型（状态转换图）。`,
b:["自顶向下","数据字典","数据模型","功能模型","行为模型","状态转换图"]},
{id:"2-03",p:38,t:"DFD 四种基本符号",c:"箭头／圆圈／直线段／方框；存储被外部实体用必须经理加工",
x:`DFD 四种基本符号：数据流——具有名字和流向的数据，标有名字的箭头；加工（数据处理）——对数据流的变换，圆圈；数据存储——可访问的存储信息，直线段；外部实体（数据源及数据终点）——位于被建模系统之外的信息生产者或消费者，标有名字的方框。补充：数据存储要被外部实体使用必须经过加工（案例考过）。记号集有两种：Gane 和 Sarson 方法、Yourdon 和 Coad 方法。`,
b:["箭头","圆圈","直线段","方框","经过加工","Gane","Yourdon"]},
{id:"2-04",p:39,t:"DFD 扩充符号",c:"与＊／或＋／异或⊕，可作用于输入和输出",
x:`DFD 扩充符号（不属于标准 Gane&Sarson 或 Yourdon，但软考考到）：与（＊）——输入流中所有输入数据流都到达后才能加工，输出流中加工结束同时产生所有输出；或（＋）——任何一个输入流到达就可加工，结果至少产生其中一个输出；异或（⊕）——只有其中一个输入流到达时才能加工，结果仅产生这些输出数据流中的一个。`,
b:["＊","＋","⊕","同时","其中一个"]},
{id:"2-05",p:41,t:"DFD 平衡原则",c:"父子图：个数一致＋方向一致；子图内部：黑洞／奇迹／灰洞",
x:`数据流图的平衡原则：（1）父图与子图平衡——个数一致（两层数据流图中的数据流个数一致）、方向一致（数据流方向一致）。（2）子图内部的平衡——黑洞：加工只有输入没有输出；奇迹：加工只有输出没有输入；灰洞：加工的输入不足以产生输出。结合案例真题能够找茬写出错误的理由。`,
b:["个数一致","方向一致","黑洞","奇迹","灰洞"]},
{id:"2-06",p:43,t:"面向对象三模型",c:"对象模型最基础最核心；功能'要做什么'／动态'何时何行为'",
x:`面向对象建模分为三个模型：对象模型（类图表示）——从结构角度定义系统中有哪些对象、属性及对象间关系，是三种模型中最基础、最核心的模型，为另两个模型提供结构基础；动态模型（状态图表示）——刻画系统或对象在时间维度上的行为变化，说明在什么状态下受何种事件触发会发生什么行为；功能模型（用例图/数据流图表示）——从用户和业务角度说明系统"要做什么"。三者相互映射、相互约束，共同构成完整统一的认识。`,
b:["对象模型","最基础、最核心","动态模型","功能模型","要做什么"]},
{id:"2-07",p:43,t:"用例模型四阶段",c:"口诀：人合细条；前三个必需",
x:`构建用例模型一般经历4个阶段：识别参与者、合并需求获得用例、细化用例描述和调整用例模型，其中前三个阶段是必需的。记忆口诀：人合细条（人合团结了就协调了）——人（识别参与者）合（合并）细（细化）条（调整）。`,
b:["4个","识别参与者","合并需求","细化用例描述","调整用例模型","人合细条"]},
{id:"2-08",p:44,t:"用例图元素与参与者",c:"参与者可在系统之外：人／其他系统／硬件设备／时钟",
x:`用例图中主要包括参与者、用例和通信关联三种元素。关联关系一般作用于参与者和用例之间；扩展、包含和继承（泛化）作用于用例和用例之间。参与者是与系统交互的所有事物，不仅可以由人承担，还可以是其他系统和硬件设备（传感器），甚至是系统时钟；参与者一定在系统之外，不是系统的一部分。参与者与参与者之间也可以发生继承关系（了解）。`,
b:["参与者","通信关联","硬件设备","系统时钟","系统之外"]},
{id:"2-09",p:46,t:"用例三关系（箭头指向必背）",c:"包含指向抽象用例／扩展指向基本用例／泛化指向父用例",
x:`用例之间的关系：包含关系（<<include>>）——从两个或多个用例提取公共行为，提取出的公共用例为抽象用例，箭头指向抽象用例；扩展关系（<<extend>>）——一个用例混合多种不同场景，分为一个基本用例和多个扩展用例，箭头指向基本用例；泛化关系——多个用例有类似结构和行为，共性抽象为父用例，子用例继承父用例所有结构、行为和关系，箭头指向父用例。利用这些关系把公共信息抽取出来便于复用，使用例模型更易于维护。`,
b:["<<include>>","抽象用例","<<extend>>","基本用例","父用例"]},
{id:"2-10",p:47,t:"分析模型与 CRC 建模",c:"前三步＝CRC（类-责任-协作者）；顺序图最常用",
x:`分析模型描述系统的基本逻辑结构：展示对象和类如何组成系统（静态模型），以及它们如何保持通信、实现系统行为（动态模型）。建立分析模型的过程：定义概念类、确定类之间的关系、为类添加职责、建立交互图；前三个步骤统称为 CRC（类——责任——协作）建模。UML2.0 提供的交互图有顺序图、交互概览图、通信图和定时图，最常用的是顺序图，几乎可以用在任何系统的场合。`,
b:["定义概念类","确定类之间的关系","为类添加职责","建立交互图","CRC","顺序图"]},
{id:"2-11",p:48,t:"类图六大关系与强弱排序",c:"口诀：饭食组聚关羽；排序：泛化=实现>组合>聚合>关联>依赖",
x:`类之间的六大关系：关联、依赖、泛化、聚合、组合、实现（聚合和组合都是关联的一种）。强弱排序：泛化＝实现＞组合＞聚合＞关联＞依赖。记忆口诀：饭（泛）食（实现）组聚关羽（依）。各关系一句话：关联——强语义联系的结构关系（学生选修课程）；依赖——B 的变化可能引起 A 的变化，临时使用（教师授课用工具）；泛化——父类与子类，子承父业并可扩展；聚合——整体与部分，部分可多属、生命周期可不同（图书馆与书籍，好聚好散）；组合——部分唯一归属、生命周期相同（汽车与发动机）；实现——接口定义行为，类负责实现。`,
b:["泛化＝实现＞组合＞聚合＞关联＞依赖","组聚关羽","生命周期可不同","生命周期相同","接口"]},
{id:"2-12",p:49,t:"UML 结构与公共机制四要素",c:"构造块／规则／公共机制；四要素：详述修饰通用划分扩展机制",
x:`UML（统一建模语言）是描述、可视化和文档化软件系统的标准建模语言，结构包括构造块、规则和公共机制三个部分。公共机制包含四大要素：详述——通过文字补充图形符号的语义信息；修饰——利用附加符号（如访问权限标识）增强元素表现力；通用划分——基于类/对象二分法抽象系统层次；扩展机制——通过构造型、标记值和约束支持建模元素的自定义扩展。`,
b:["构造块","规则","公共机制","详述","修饰","通用划分","扩展机制","构造型、标记值和约束"]},
{id:"2-13",p:49,t:"UML 4+1 视图（＝RUP 4+1）",c:"口诀：罗凯进五常；各视图对应角色",
x:`UML 4+1 视图＝RUP 4+1 视图，以用例为中心。逻辑视图——系统的功能模块及其相互关系（类、子系统、包），对应分析人员和测试人员；进程视图——系统运行时的进程和线程的组织、交互，以及并发和同步机制，是逻辑视图的一次执行实例，对应系统集成人员；实现视图——软件构件在开发环境中的组织结构（代码模块化、软件包），对应程序员；部署视图——把构件部署到一组物理节点上，软件到硬件的映射，对应系统工程师；用例视图——通过用例和参与者描述系统的功能需求，对应最终用户。记忆口诀：罗凯进五常——罗（逻辑）凯（开发/实现）进（进程）五（物理/部署）常（场景/用例）。`,
b:["逻辑视图","进程视图","实现视图","部署视图","用例视图","系统集成人员","程序员","系统工程师","最终用户","罗凯进五常"]},
{id:"2-14",p:51,t:"UML 14 种图分类",c:"先记结构图七种，剩下的都是行为图；用例图在 2.x 是行为图",
x:`UML2.5 包括14种图。结构图（描述事物之间的关系）：类图、对象图、包图、组合结构图、构件图、部署图、轮廓图（UML2.5 下轮廓图取代了制品图）。行为图（描述交互）：用例图、活动图、状态机图、顺序图/序列图、通信图/协作图、时间图（交互图）、交互概览图。重点关注：用例图、类图、活动图、状态图、顺序图。唯一要强调：用例图在 UML2.x 下是一种行为图。`,
b:["14种","结构图","类图","对象图","包图","构件图","部署图","行为图","轮廓图"]},
{id:"2-15",p:52,t:"UML 四种关系（线型）",c:"依赖虚线箭头／泛化空心三角实线／实现空心三角虚线；包含扩展属依赖、组合聚合属关联",
x:`UML 事务的关系就4种：依赖、关联、泛化、实现，其他都是引申。依赖关系——一个元素的改动可能影响另一个使用它的元素，带箭头的虚线，箭头指向被依赖元素；关联关系——对象间较稳定的结构联系，实线，可标注名称、角色名和多重性；泛化关系——即继承，子类继承父类的属性和方法，带空心三角形箭头的实线，箭头指向父类，体现 is-a；实现关系——类实现接口中定义的所有抽象方法，带空心三角形箭头的虚线，箭头指向接口。引申：用例图中的包含和扩展都属于依赖关系；类图中的组合和聚合属于关联关系。`,
b:["依赖","虚线","关联","实线","泛化","空心三角形","实现","接口"]},
{id:"2-16",p:53,t:"顺序图",c:"时间顺序；四核心概念＋交互片段（UML2 新增）",
x:`顺序图是一种最常用的动态交互图，用于显示对象间的交互活动，关注对象之间消息传送的时间顺序。核心概念：对象、生命线、执行发生、消息；交互片段——UML2 中的新增概念，用于封装交互图中的片段，并可对片段施加选择、循环、并行等操作，使 UML 支持复杂的交互建模。推荐使用场合：用例分析、用例设计。`,
b:["时间顺序","对象","生命线","执行发生","消息","交互片段","并行"]},
{id:"2-17",p:54,t:"活动图",c:"控制流＋数据流；分区描述参与者",
x:`活动图将业务流程或其他计算的结构展示为内部一步步的控制流和数据流，主要用于描述某一方法、机制或用例的内部行为。核心概念：活动与组合活动（内部控制逻辑）、对象与对象流（相关数据对象）、转移与分支（控制先后顺序）、并发与同步、分区（描述活动的不同参与者）。推荐使用场合：业务建模、需求、类设计。`,
b:["控制流","数据流","内部行为","对象流","分支","分区"]},
{id:"2-18",p:56,t:"需求验证三法：评审／检查／走查",c:"评审征求意见（正式）／检查详细验证（正式+严格）／走查带领讲解（非正式）",
x:`三者最大区别：评审是征求干系人专家意见（正式），检查是详细验证（正式+严格），走查是带领团队成员逐部分讲解（非正式）。评审——一次正式的会议，向用户或其他项目干系人介绍一个或一组工作产品，以征求对方的意见和批准；检查——一种正式的评估方法，由非制作者本人的个人或小组详细检查工作产品，验证是否有错误、是否违反开发标准；走查——由某个开发人员领导一个或多个开发团队成员对其工作产品进行检查，其他成员针对技术、风格、可能的错误提出意见。`,
b:["评审","意见和批准","检查","非制作者本人","走查","非正式"]},
{id:"2-19",p:57,t:"需求管理",c:"CMM 可重复级关键过程域；基线；三内容：变更／风险／跟踪",
x:`在 CMM 中，需求管理是可重复级的一个关键过程域，其目标是为软件需求建立一个基线，供软件开发及其管理使用，使软件计划、产品和活动与软件需求保持一致。书本要求掌握的内容：变更管理、风险管理和需求跟踪。`,
b:["可重复级","基线","变更管理","风险管理","需求跟踪"]}
]}]};

GROUPS.g2={name:"设计·架构",chapters:[
{n:"第3章 系统设计",blocks:[
{id:"3-01",p:67,t:"工作流参考模型 WRM 六模块",c:"口诀：指引丁克调管",
x:`工作流参考模型（WRM）包含6个基本模块：工作流执行服务、工作流引擎、流程定义工具、客户端应用、调用应用和管理监控工具。WRM 为工作流管理系统（WFMS）关键模块提供功能描述，描述模块之间的交互，且独立于特定产品或技术的实现。记忆口诀：指引丁克调管——指（执行）引丁（定义）克（客户端）调（调用）管（管理）。`,
b:["6个","工作流执行服务","工作流引擎","流程定义工具","客户端应用","调用应用","管理监控工具","指引丁克调管"]},
{id:"3-02",p:69,t:"面向对象设计基本思想",c:"抽象／封装／可扩展（继承+多态）",
x:`面向对象设计（OOD）是面向对象分析（OOA）方法的延续，其基本思想包括抽象、封装和可扩展性，其中可扩展性主要通过继承和多态来实现。在面向对象设计中，数据结构和在其上定义的操作算法封装在一个对象之中。`,
b:["抽象","封装","可扩展性","继承","多态"]},
{id:"3-03",p:69,t:"设计类三分：实体／边界／控制",c:"先认边界（窗口/协议/打印机/报表），名词=实体，动名词=控制",
x:`面向对象设计中的三类设计类：实体类——映射需求中的每个实体，保存需永久存储在存储体中的信息，采用业务领域术语命名（名词），一定有属性，代表业务领域实际对象，具有永久性（如学员类、课程类）；控制类——用于控制用例工作，对用例特有的控制行为建模，由动宾结构短语转化而来的名词命名（如"身份验证器"），通常没有属性但一定有方法，协调用例执行时不同对象间的交互，在用例执行时产生、执行完毕后消亡；边界类——封装用例内外流动的信息或数据流，处于系统与外界交界处，与系统接口紧密相关（窗口、通信协议、打印机接口、报表等），可既有属性也有方法，随系统运行一直存在，隔离外部环境变更对系统内部的影响。`,
b:["实体类","永久","名词","控制类","动宾结构","边界类","交界处","窗口、通信协议、打印机接口、报表"]},
{id:"3-04",p:70,t:"面向对象设计七原则",c:"SOLID＋组合聚合复用＋最少知识（迪米特）",
x:`面向对象设计原则（可维护性的复用以设计原则为基础）：单一职责原则（S）——类应该只有一个设计目的；开闭原则（O）——对扩展开放、对修改封闭，通过添加抽象层实现，是其他原则的基础；里氏替换原则（L）——软件实体使用基类对象时适用于子类对象，应将变化类设计为抽象类或接口；接口隔离原则（I）——接口提供客户端需要的行为，将大接口方法分至小接口；依赖倒置原则（D）——抽象不依赖于细节，针对接口编程，是实现开闭原则的主要机制；组合/聚合复用原则——通过组合或聚合关系复用已有对象，比继承更灵活、耦合度低；最少知识原则（迪米特法则）——软件实体应尽量少与其他实体相互作用。`,
b:["单一职责","开闭原则","对扩展开放、对修改封闭","里氏替换","接口隔离","依赖倒置","针对接口编程","迪米特"]},
{id:"3-05",p:71,t:"结构化设计与四活动",c:"面向数据流；四活动：数据／结构／界面／过程",
x:`结构化设计（SD）是一种面向数据流的方法，以软件需求规格说明（SRS）、系统分析（SA）阶段所产生的数据流图和数据字典等文档为基础，是一个自顶向下、逐步求精和模块化的过程。软件设计模型包括四个既独立又相互联系的活动：数据设计、软件结构设计、人机界面设计（接口设计）和过程设计。`,
b:["面向数据流","数据流图和数据字典","自顶向下","模块化","数据设计","软件结构设计","人机界面设计","过程设计"]},
{id:"3-06",p:71,t:"模块划分四原则",c:"大小适中 50-200 行／扇入扇出 3-4 不超 7／深度宽度／信息隐蔽",
x:`模块划分原则（高内聚、低耦合）：①模块大小适中——过大功能不单一，过小增加复杂度、调用频繁，一般模块实现代码在1-2页纸内或50-200行；②模块扇入扇出合理——扇出指模块直接调用下级模块的个数，扇出大复杂度高，过大增加中间层次，过小可分解下级模块或合并到上级；扇入指直接调用该模块的上级模块个数，扇入大复用程度高；系统平均扇入和扇出系数为3或4，不超过7；③深度和宽度适当——深度指模块层数，宽度指同一层次模块总数的最大值；④信息隐蔽——采用封装技术隐藏模块实现细节，模块设计成"黑盒"，仅通过接口交互。`,
b:["高内聚、低耦合","50-200行","扇出","扇入","复用程度高","3或4","不超过7","深度","宽度","黑盒"]},
{id:"3-07",p:72,t:"耦合七级（低→高）",c:"口诀：非鼠标控制外公嘞；最低非直接、最高内容",
x:`耦合表示模块之间联系的程度，分为7种（从低到高）：非直接耦合——两个模块之间没有直接关系，联系完全通过主模块的控制和调用来实现；数据耦合——借助参数表传递简单数据值；标记耦合——通过参数表传递记录信息（数据结构）；控制耦合——传递的信息中包含用于控制模块内部逻辑的信息；外部耦合——都访问同一全局简单变量且不通过参数表传递；公共耦合——都访问同一个公共数据环境（全局数据结构、共享的通信区、内存的公共覆盖区）；内容耦合——一个模块直接访问另一模块的内部数据、不通过正常入口转入、程序代码重叠或有多个入口。记忆口诀：非鼠标控制外公嘞。`,
b:["非直接耦合","数据耦合","标记耦合","控制耦合","外部耦合","公共耦合","内容耦合","非鼠标控制外公嘞"]},
{id:"3-08",p:73,t:"内聚七级（高→低）",c:"功能最高、偶然最低；顺序有数据依赖、过程无",
x:`内聚表示模块内部各成分之间的联系程度，从功能角度度量，好的内聚模块应当恰好做目标单一的一件事情。7种内聚（从高到低）：功能内聚——完成一个单一功能，各个部分协同工作，缺一不可；顺序内聚——处理元素相关且必须顺序执行，存在数据传递和依赖关系；通信内聚——所有处理元素集中在一个数据结构的区域上；过程内聚——处理元素相关且必须按特定次序执行，不存在数据传递和依赖关系；瞬时内聚（时间内聚）——所包含的任务必须在同一时间间隔内执行；逻辑内聚——完成逻辑上相关的一组任务；偶然内聚（巧合内聚）——完成一组没有关系或松散关系的任务。顺序与过程的最大区别：顺序内聚一个成分的输出作为另一个成分的输入，存在数据传递和依赖关系；过程内聚即使没有数据传递也可组合。`,
b:["功能内聚","顺序内聚","通信内聚","过程内聚","瞬时内聚","逻辑内聚","偶然内聚","数据传递和依赖关系"]},
{id:"3-09",p:74,t:"设计模式 23 分类打油诗（赠）",c:"创建5／结构7／行为11；三句打油诗",
x:`设计模式分类打油诗：（结构）试桥组装外享代——适配器、桥接、组合、装饰、外观、享元、代理；（行为）观察命令责任链，迭代模板状态变。中介策略备忘录，解释访问都包含——观察者、命令、责任链、迭代器、模板方法、状态、中介者、策略、备忘录、解释器、访问者；（创建）工厂抽象建造者，单例原型巧构成——工厂方法、抽象工厂、建造者、单例、原型。`,
b:["试桥组装外享代","观察命令责任链","中介策略备忘录","工厂抽象建造者","单例原型"]}
]},
{n:"第4章 系统架构设计",blocks:[
{id:"4-01",p:76,t:"信息系统架构基本定义",c:"结构行为属性的高级抽象；设计金字塔两层：数据设计＋体系结构设计",
x:`信息系统架构是关于软件系统的结构、行为和属性的高级抽象。在描述阶段，其对象是直接构成系统的抽象组件以及各组件之间的连接规则，特别是相对细致地描述组件之间的通信；在实现阶段，抽象组件被细化为实际的组件（具体类或对象）。软件系统架构不仅指定系统的组织结构和拓扑结构，而且表示系统需求和构成组件之间的对应关系，包括设计决策的基本方法和基本原理。软件体系结构设计通常考虑设计金字塔中的两个层次——数据设计和体系结构设计：数据设计体现传统系统的数据构件和面向对象系统中类的定义（封装属性和操作）；体系结构设计主要关注软件构件的结构、属性和交互作用。`,
b:["高级抽象","连接规则","通信","组织结构和拓扑结构","数据设计","体系结构设计"]},
{id:"4-02",p:78,t:"ABSD 基本概念（选择常考4-5分）",c:"商业+质量+功能需求组合驱动；三基础；质量场景四类",
x:`基于体系结构的软件设计（ABSD）是由体系结构驱动的，即由构成体系结构的商业、质量和功能需求的组合驱动的。ABSD 有3个基础：①功能的分解（使用基于模块的内聚和耦合技术）；②通过选择体系结构风格来实现质量和商业需求；③软件模板的使用。ABSD 是自顶向下、递归细化的方法，有助于降低体系结构设计的随意性。视角：静态视角（功能组织）能判断质量特性，动态视角（并发行为）能判断系统行为特性。用例用来捕获功能需求；通过定义特定场景来捕获质量需求，称为质量场景——捕获变更、性能、可靠性和交互性，分别称之为变更场景、性能场景、可靠性场景和交互性场景。质量场景必须包括预期的和非预期的场景（如用户每年增加10%为预期、增加100%为非预期），非预期场景在决定设计的边界条件时很有用。`,
b:["商业、质量和功能需求","3个基础","内聚和耦合","体系结构风格","软件模板","递归细化","用例","质量场景","边界条件"]},
{id:"4-03",p:80,t:"ABSD 六子过程",c:"口诀：许设温敷实验；重点＝需求与文档化",
x:`ABSD 模型把基于体系结构的软件过程划分为6个子过程：体系结构需求、设计、文档化、复审、实现和演化。口诀：许设温敷实验。要点：需求——来源为系统质量目标、商业目标及开发人员商业目标，需求过程获取用户需求并标识构件；文档化——文档是系统演化各阶段人员通信媒介和设计验证的基础，主要输出体系结构规格说明和测试质量设计说明书，要完整高质量、从使用者角度编写、分发所有相关开发人员并保证最新；复审——主版本软件体系结构分析后安排外部人员（用户代表和领域专家）参加，常搭建最小化可运行系统评估测试架构，目的是标识潜在风险、发现设计缺陷和错误；实现——以复审后的文档化体系结构说明书为基础，利用组装支持工具组装构件；演化——需求变化归类、制订演化计划、修改/增加/删除构件、更新构件相互作用、构件组装与测试、技术评审。`,
b:["6个子过程","体系结构规格说明","测试质量设计说明书","用户代表和领域专家","最小化可运行系统","许设温敷实验"]},
{id:"4-04",p:80,t:"架构风格定义",c:"惯用模式＝词汇表＋约束，定义一个系统家族",
x:`软件体系结构风格是描述某一特定应用领域中系统组织方式的惯用模式。体系结构风格定义一个系统家族，即一个体系结构定义一个词汇表和一组约束：词汇表中包含一些构件和连接件类型，这组约束指出系统是如何将这些构件和连接件组合起来的。体系结构风格反映了领域中众多系统所共有的结构和语义特性，并指导如何将各个模块和子系统有效地组织成一个完整的系统。`,
b:["惯用模式","系统家族","词汇表","约束","构件和连接件"]},
{id:"4-05",p:81,t:"数据流风格：批处理 vs 管道-过滤器",c:"批处理整体传递前完后始；管道前出后入可并行",
x:`数据流体系结构风格分两种：批处理——每个处理步骤是一个单独的程序，每一步必须在前一步结束后才能开始，数据必须是完整的、以整体的方式传递，基本构件是独立的应用程序（如传统编译器、Windows 的 BAT 程序）；管道-过滤器——把系统分解为几个处理步骤，一个步骤的输出是另一个步骤的输入，处理步骤由过滤器实现、数据传输由管道负责，基本构件是过滤器、连接件是数据流传输管道，可以并行（如 Unix Shell 程序）。二者区别必背：批处理前后构件不一定有关联、作为整体传递，必须前一个执行完才能执行下一个；管道-过滤器是前一个输出作为后一个输入，前面执行完后可以开始下一步的执行。`,
b:["批处理","整体的方式传递","管道-过滤器","过滤器","数据流传输管道","并行","前一个输出作为后一个输入"]},
{id:"4-06",p:81,t:"调用/返回风格四类",c:"主程序子程序／面向对象／层次型／C-S（两层三组成、三层加应用服务器）",
x:`调用/返回风格采用调用与返回机制，是一种分治策略，将复杂大系统分解为若干子系统以降低复杂度、增加可修改性。四类：主程序/子程序——单线程控制，构件即主程序和子程序，子程序可合成为模块，程序调用充当连接件，调用关系具有层次性（早期结构化程序设计）；面向对象——建立在数据抽象基础上，数据的表示方法和相应操作封装在抽象数据类型或对象中，构件是对象（Java/C# 应用）；层次型——组成层次结构，每一层为上层提供服务并作为下层的客户，构件在层上实现了虚拟机，连接件由层间交互协议定义，每一层最多只影响两层，只要给相邻层提供相同接口、允许每层用不同方法实现，为软件重用提供强大支持（Web 系统、数据库应用）；客户端/服务器——基于资源不平等且为实现共享而提出，两层C/S 有3个主要组成部分：数据库服务器、客户应用程序和网络；三层C/S 增加一个应用服务器，应用功能分为表示层、功能层和数据层三层。`,
b:["分治策略","主程序/子程序","数据抽象","虚拟机","层间交互协议","每一层最多只影响两层","数据库服务器、客户应用程序和网络","应用服务器","表示层、功能层和数据层"]},
{id:"4-07",p:82,t:"以数据为中心：仓库与黑板",c:"中央数据结构＋独立构件；黑板＝分级问题求解",
x:`仓库体系结构风格：仓库是存储和维护数据的中心场所。两种不同的构件：中央数据结构说明当前数据的状态，以及一组对中央数据进行操作的独立构件；仓库与独立构件间的相互作用在系统中会有大的变化，连接件即为仓库与独立构件之间的交互（现代集成开发环境 IDE、企业级数据管理系统）。黑板体系结构风格：一种问题求解模型，将问题的解空间组织成一个或多个应用相关的分级结构，分级结构的每一层信息由一个唯一的词汇来描述，代表问题的部分解（信号处理领域如语音识别和模式识别；另一应用是松耦合代理数据共享存取）。`,
b:["中心场所","中央数据结构","独立构件","IDE","问题求解模型","分级结构","语音识别","部分解"]},
{id:"4-08",p:83,t:"虚拟机风格：解释器与规则系统",c:"解释器四组成＋效率低；规则系统四组成＝专家系统",
x:`虚拟机体系结构风格的基本思想是人为构建一个运行环境，在这个环境之上可以解析与运行自定义的一些语言，增加架构的灵活性（在线游戏支持用户自定义对象、业务灵活组合）。解释器包括：（1）完成解释工作的解释引擎；（2）包含将被解释的代码的存储区；（3）记录解释引擎当前工作状态的数据结构；（4）记录源代码被解释执行进度的数据结构。解释器缺点是执行效率较低。规则系统（基于规则的系统）包括：规则集、规则解释器、规则/数据选择器及工作内存，应用于专家系统/决策支持系统。`,
b:["运行环境","解释引擎","存储区","工作状态","执行进度","执行效率较低","规则集","规则解释器","工作内存","专家系统"]},
{id:"4-09",p:83,t:"独立构件风格与 C2",c:"进程通信＝消息传递；事件系统＝触发广播注册；C2 顶底相连不直连",
x:`独立构件体系结构风格强调系统中的每个构件都是相对独立的个体，它们之间不直接通信，以降低耦合度、提升灵活性。进程通信风格——构件是独立的过程，连接件是消息传递，构件通常是命名过程，消息传递方式可以是点到点、异步或同步方式及远程过程调用等（分布式系统、微服务架构）。事件系统（基于事件的隐式调用）风格——构件不直接调用一个过程，而是触发或广播一个或多个事件；其他构件中的过程在一个或多个事件中注册，当事件被触发，系统自动调用在这个事件中注册的所有过程（编程环境中集成各种工具、数据库管理系统确保数据一致性约束、用户界面系统、编辑器语法检查）。C2 风格——通过连接件绑定在一起按照一组规则运作的并行构件网络：构件和连接件都有顶部和底部；构件的顶部连接到连接件的底部、底部连接到连接件的顶部，构件之间不允许直接连接；连接件可以连接任意数量的构件和其他连接件。`,
b:["不直接通信","消息传递","命名过程","触发或广播","注册","C2","顶部","底部","不允许直接连接"]},
{id:"4-10",p:83,t:"闭环控制（架构-过程控制）",c:"反馈循环：空调控温、定速巡航",
x:`闭环控制体系结构风格（架构-过程控制）：软件与硬件之间可以粗略地表示为一个反馈循环，这个反馈循环通过接受一定的输入，确定一系列的输出，最终使环境达到一个新的状态。典型应用：空调控温、定速巡航。`,
b:["闭环控制","反馈循环","空调控温","定速巡航"]},
{id:"4-11",p:84,t:"软件架构复用",c:"机会复用 vs 系统复用；产品线＝公共特性集＋核心资产库",
x:`软件架构复用是指在多个软件系统或项目中重复使用已有的架构设计、组件、模式、技术或构件，以提高开发效率、降低成本、提高质量和可维护性。类型：机会复用——开发过程中只要发现有可复用的资产就对其进行复用；系统复用——开发之前就进行规划，以决定哪些需要复用。软件产品线：一组软件密集型系统，共享一个公共的、可管理的特性集，满足某个特定市场或任务的具体需要，以规定的方式用公共的核心资产集成开发出来；核心资产库包括软件架构及其可剪裁的元素、设计方案及其文档、用户手册、项目管理的历史记录（预算和进度）、软件测试计划和测试用例。`,
b:["机会复用","系统复用","软件产品线","特性集","核心资产库","可剪裁","测试用例"]},
{id:"4-12",p:85,t:"DSSA 特定领域软件架构",c:"三基本活动／四参与人员；垂直域换共性、水平域含共性",
x:`DSSA（特定领域软件架构）基本活动三种：领域分析——目标是获得领域模型，描述领域中系统的共同需求；领域设计——目标是获得 DSSA；领域实现——目标是依据领域模型和 DSSA 开发和组织可重用信息。参与人员四种：领域专家（该领域系统的资深用户及软件工程师）、领域分析人员（具备知识工程背景的资深系统分析员）、领域设计人员（资深软件设计人员）、领域实现人员（资深程序设计人员）。垂直域：定义多个系统所共有的功能，在一个特定领域多个系统间共享；水平域：定义多个系统和多个系统族中功能区域的共有部分，只要存在多个系统或系统族有部分功能共性即可。`,
b:["领域分析","领域模型","领域设计","领域实现","领域专家","知识工程背景","资深软件设计人员","垂直域","水平域"]},
{id:"4-13",p:87,t:"软件系统质量属性（开发期6/运行期7）",c:"次重点但选择爱考；开发期含可扩展可重用，运行期含性能安全",
x:`软件系统质量属性（架构新教材第二版新增，与面向架构评估的质量属性区分）：开发期质量属性6个——易理解性、可扩展性、可重用性、可测试性、可维护性、可移植性；运行期质量属性7个——性能、安全性、可伸缩性、互操作性、可靠性、可用性、鲁棒性。`,
b:["开发期","易理解性","可重用性","可移植性","运行期","可伸缩性","互操作性","鲁棒性"]},
{id:"4-14",p:87,t:"九大必考质量属性与对策",c:"性能队列并发／可靠冗余校验／可用心跳故障转移／安全认证加密审计／可修改模块化",
x:`架构评估普遍关注的9种质量属性：性能——系统的响应能力，处理事务所需时间或单位时间内处理事务数量；对策：优先级队列、增加计算资源、减少计算开销、引入并发机制、资源调度。可靠性——在应用错误、意外错误使用情况下维持功能特性的基本能力，通过平均失效时间衡量；对策：冗余设计（硬件/数据冗余）、错误检测与恢复（奇偶校验、循环冗余校验）、异常处理、备份与恢复、负载均衡。可用性——系统正常运行的时间比例，两次故障间时长或故障恢复速度；对策：心跳机制（检测组件在线状态）、冗余系统（双机热备、集群）、快速恢复机制、内置监控器监控与预警、故障转移。安全性——向合法用户提供服务同时阻止非授权访问，包括机密性、完整性、不可否认性、可控性；对策：用户认证、授权管理（RBAC）、数据加密、防火墙、入侵检测、审计与日志。可修改性——快速、高性价比地变更系统的能力，包括可维护性、可扩展性、结构重组、可移植性；对策：模块化设计、接口标准化、抽象与封装、配置管理、版本控制。互操作性——与其他系统或环境交互，为外部功能和数据结构提供精心设计的入口；对策：标准协议和接口（RESTful API、SOAP）、数据格式转换、中间件、服务注册与发现。可移植性——适应不同运行环境的能力；对策：遵循标准协议与标准 API、抽象层（虚拟机）、兼容性测试。可测试性——软件能够被有效测试的难易程度；对策：设计分层与模块化、提供测试接口。易用性——系统让用户"好学、好找、好操作、少犯错"的程度；对策：统一交互规范、降低认知负荷、新手引导。可靠性与可用性辨析：真题中"发现错误并启用备用系统/重定向请求"类场景默认归结到可用性。`,
b:["优先级队列","并发机制","平均失效时间","循环冗余校验","心跳机制","双机热备","故障转移","机密性、完整性、不可否认性、可控性","模块化设计","结构重组","服务注册与发现"]},
{id:"4-15",p:90,t:"质量属性场景六部件",c:"口诀：原词换纸想读；六类属性：可用可改性测能易安",
x:`质量属性场景是一个具体的质量属性需求，是利益相关者与系统交互的简短陈述，引入目的是精确描述软件系统的质量属性。6个组成部分：刺激源——生成刺激的实体；刺激——到达系统时需考虑的条件；环境——刺激发生的条件；制品——被激励的对象；响应——激励到达后采取的行动；响应度量——对响应进行度量的方式。记忆口诀：原词换纸想读——原（刺激源）词（刺激）换（环境）纸（制品）想（响应）读（度量）。6类质量属性：可用性、可修改性、性能、可测试性、易用性和安全性。常考六部件示例：可用性的响应度量——可用时间/可用时长、故障修复时间（MTTR）；可修改性的响应度量——修改成本/工时、影响范围。`,
b:["简短陈述","刺激源","刺激","环境","制品","响应","响应度量","原词换纸想读","MTTR"]},
{id:"4-16",p:92,t:"架构评估六概念（敏感点/权衡点句式辨析）",c:"敏感点=一个特性；权衡点=多敏感点综合（影响多个质量属性）；风险点句式'如果…可能…'",
x:`系统架构评估中的重要概念（语文题，靠句式判定）：敏感点——一个或多个构件（和/或构件之间的关系）的特性，如"对查询请求处理时间的要求将影响系统的数据传输协议和处理过程的设计"；权衡点——影响多个质量属性的特性，是多个敏感点的综合，如加密级别的选择：AES-256 提升安全性但增加计算量降低性能，影响了安全性和性能多个质量属性；风险点——可能导致系统架构出现问题或无法满足质量属性要求的特性、决策或情况，句式"如果……，可能……，影响"；非风险点——不会对架构质量属性造成负面影响或影响在可接受范围内，如选用成熟且持续更新的 RabbitMQ；风险承担者/利益相关人——系统架构涉及到的利益相关者，会试图影响架构决策以实现自己目标；场景——从风险承担者角度对系统交互的简短描述，一般采用刺激、环境和响应三方面来描述。`,
b:["敏感点","权衡点","多个敏感点的综合","风险点","非风险点","风险承担者","刺激、环境和响应"]},
{id:"4-17",p:93,t:"架构评估三类与 SAAM/ATAM",c:"软考只考场景式与度量式；SAAM 主可修改性；ATAM 四阶段迭代关注需求",
x:`系统架构评估是在对架构分析、评估的基础上，对架构策略的选取进行决策。方法分3类：基于调查问卷或检查表的方式、基于场景的方式和基于度量的方式（软考只考后两种）。SAAM（基于场景的架构分析方法）：通过场景验证架构假设和原则，评估架构固有风险，比较不同架构方案；关注的主要质量属性是可修改性；针对最终架构而非详细设计进行评估；过程包括场景开发、架构描述、单场景评估、场景交互评估和总体评估。ATAM（架构权衡分析方法）：在 SAAM 基础上发展起来，主要针对性能、可用性、安全性和可修改性，在系统开发之前对这些质量属性进行评价和折中；包括4个主要阶段：场景和需求收集、架构视图和场景实现、属性模型构造和分析、折中；整个过程是迭代式的；真题考过 ATAM 关注什么——定论是需求。`,
b:["3类","基于场景","基于度量","SAAM","可修改性","最终架构","场景开发","ATAM","性能、可用性、安全性和可修改性","场景和需求收集","折中","迭代式","需求"]}
]}]};
/*__G3__*/
GROUPS.g3={name:"测试·可靠·项管",chapters:[
{n:"第5章 软件测试",blocks:[
{id:"5-01",p:96,t:"黑盒／白盒／灰盒＋静态／动态",c:"黑盒看输入输出、白盒走全部逻辑路径、灰盒多用于集成；静态不运行、动态三部分",
x:`按被测程序是否可见：黑盒测试——又叫功能测试，将程序看作黑盒，不考虑内部结构与特性，从用户角度基于输入输出关系测试，用例设计方法有等价类划分法等，在系统和确认测试中作用重要；白盒测试——又称结构测试，需全面了解程序内部逻辑结构，对所有逻辑路径测试，覆盖标准有逻辑覆盖、循环覆盖和基本路径测试，主要用于军工、航天等可靠性要求高的领域；灰盒测试——介于二者之间，多用于集成测试，既关注输出输入正确性也关注程序内部情况。按是否需要执行被测程序：静态测试——不运行被测程序，通过分析源程序语法、结构、过程、接口检查正确性，包括代码检查、静态结构分析、代码质量度量，发现缺陷早但耗时长；动态测试——通过运行被测程序检查运行结果与预期差异，由构造测试用例、执行程序、分析程序输出结果三部分组成。`,
b:["功能测试","输入输出","等价类划分","结构测试","逻辑路径","集成测试","代码检查","静态结构分析","代码质量度量","构造测试用例"]},
{id:"5-02",p:97,t:"按测试对象划分",c:"性能五子类：负载／压力／并发／容量／可靠性",
x:`按测试对象划分：功能测试——根据产品特性、操作描述和用户场景测试产品功能，通过需求分析、编写测试案例、准备数据、执行测试、对比结果并报告6个步骤完成；性能测试——测试不同情况下的响应时间，包括负载测试、压力测试、并发测试、容量测试、可靠性测试等；安全测试——验证应用程序安全等级，分应用程序本身安全性和数据安全两层面，包括渗透测试；兼容性测试——测试软件之间、软件与硬件之间能否协调工作，含操作系统平台及版本、前后兼容、与其他软件兼容、数据兼容；界面测试——布局、风格、控件位置、导航等；易用性测试——又称用户体验测试；稳定性测试——长时间运行观察内存占用等是否出现问题。`,
b:["负载测试","压力测试","并发测试","容量测试","渗透测试","兼容性测试","用户体验测试","稳定性测试"]},
{id:"5-03",p:98,t:"按阶段：单元／集成／系统",c:"单元白盒为主开发人员做；集成针对高层设计；系统黑盒整体",
x:`按测试阶段划分：单元测试——对软件中最小可测试单元检查验证，以白盒技术为主、黑盒技术为辅，一般由开发人员在组长监督下完成，测试阶段在编码前后，测试内容包括模块接口、局部数据；集成测试——将软件集成起来后进行测试（又叫子系统测试），主要针对软件高层设计，以模块和子系统为单位，测试阶段在单元测试之后，内容包括模块间数据传输等；系统测试——对整个系统进行测试，将硬件、软件、操作人员看作整体，检验是否符合系统说明书，可发现系统分析和设计错误，包括恢复测试、安全测试、压力测试等，测试阶段在集成测试之后，方法为黑盒测试。`,
b:["最小可测试单元","白盒技术为主","开发人员","模块接口","高层设计","模块间数据传输","操作人员","黑盒测试"]},
{id:"5-04",p:98,t:"白盒覆盖六标准（弱→强）",c:"口诀：路条组判｜条条判语；语句最弱1、路径最强6；条件覆盖不保证判定结果",
x:`白盒测试覆盖标准（发现错误能力从弱到强）：语句覆盖（1，最弱）——每条语句至少执行一次；判定覆盖（2.5）——每个判定的每个分支至少执行一次；条件覆盖（2.5）——每个判定的每个条件应取到各种可能的值，但不考虑组合；判定条件覆盖（4）——同时满足判定覆盖和条件覆盖；条件组合覆盖（5）——每个判定中各条件的每一种组合至少出现一次；路径覆盖（6，最强）——每一个判断的所有可能结果都出现过、所有条件的可能结果都出现过、每个进入点及结束点都执行过。记忆口诀（从高到低）：路条组判｜条条判语——路（路径）条组（条件组合）判｜条（判定条件）条（条件）判（判定）语（语句）。典型陷阱：条件覆盖不一定保证整个判断结果的真假都出现（如 A=true,B=false 与 A=false,B=true 都使 A&&B 为 false，true 分支未覆盖）。`,
b:["语句覆盖","判定覆盖","条件覆盖","判定条件覆盖","条件组合覆盖","路径覆盖","不考虑组合","路条组判","条条判语"]}
]},
{n:"第7章 系统可靠性",blocks:[
{id:"7-01",p:109,t:"可靠性定量五指标",c:"记后缀：F失败/R修复/A确认/D检测；MTTR与MTTD很小→MTBF≈MTTF",
x:`软件可靠性定量指标（记后缀）：MTBF（Mean Time Between Failures，平均故障间隔时间）——两次相邻故障之间的平均工作时间，包括故障检测时间和故障修复时间；MTTR（Mean Time to Repair/Recover，平均修复时间）——从发生故障到恢复正常运行所需平均时间；MTTA（Mean Time to Acknowledge，平均确认时间）——从系统发出故障警报到相关人员确认故障的平均时间；MTTF（Mean Time to Failure，平均失效时间）——从开始使用到出现故障（不包括检测和修复）的平均时间；MTTD（Mean Time to Detect，平均发现时间）——从故障发生到故障被检测到的平均时间。实际应用中 MTTR、MTTD 很小，通常认为 MTBF 约等于 MTTF（选择题考过）。`,
b:["MTBF","故障检测时间和故障修复时间","MTTR","MTTA","确认","MTTF","不包括检测和修复","MTTD","约等于"]},
{id:"7-02",p:113,t:"失效概率与串并联公式",c:"串联连乘；并联＝1减全失效；F(t) 从 0 趋近 1",
x:`失效概率 F(t)：软件在运行过程中的失效概率函数，初始运行时刻失效概率为0，随运行时间增加不断增大，运行时间趋于无穷时接近1，体现软件缺陷不可避免的客观规律。串联系统——所有组件依次连接，只有在所有组件都正常工作的情况下整个系统才正常运行，若任何一个组件失效整个系统失败；可靠性为各组件可靠性的乘积：R＝R1×R2×…×Rn。并联系统——多个组件提供冗余，即使某个组件故障系统仍能继续工作；可靠性为1减去所有组件都失效的概率：R＝1−(1−R1)(1−R2)…(1−Rn)。真题中出现过串并联混合系统。`,
b:["0","接近1","乘积","1−(1−R1)(1−R2)","冗余"]},
{id:"7-03",p:108,t:"可靠性设计技术一览",c:"N版本多数表决／冗余备用切换／检错检测报警／双机热备心跳／集群接管",
x:`提高可靠性的设计技术：N版本程序设计——设计多个不同软件版本，对同样输入采用多数表决方式，各版本使用不同算法、编程语言、测试方法等确保相互独立；冗余设计——在主系统外设计备用软件模块，主模块故障时切换，可提高可靠性但增加额外开销；检错技术——在软件中设置检测点和检测机制，通过监测返回结果、运行时间等方式检测运行状态，发现故障后停止软件并报警；降低复杂度设计——软件复杂度（模块内部复杂性＋模块间关联复杂性）过高是软件缺陷根源，通过简化结构、优化数据流降低复杂度；双机热备——主备服务器模式，通过"心跳"检测切换；服务器集群——多台服务器组成单一系统，某台故障时其他服务器接管。`,
b:["多数表决","相互独立","备用","检测点和检测机制","报警","双机热备","心跳","服务器集群"]}
]},
{n:"第8章 项目管理",blocks:[
{id:"8-01",p:116,t:"进度管理六过程",c:"定义→排序→资源估算→历时估算→计划编制→控制",
x:`进度管理是采用科学的方法确定进度目标、编制进度计划和资源供应计划、进行进度控制，在与质量成本目标协调的基础上实现工期目标。六个过程：活动定义——确定完成项目各项可交付成果而需开展的具体活动；活动排序——识别和记录各项活动之间的先后关系和逻辑关系；活动资源估算——估算完成各项活动所需的资源类型和数量；活动历时估算——估算完成各项活动所需的具体时间；进度计划编制——分析活动顺序、持续时间、资源要求和进度制约因素，制订进度计划；进度控制——发现偏差则分析原因或进行调整。`,
b:["活动定义","活动排序","活动资源估算","活动历时估算","进度计划编制","进度控制"]},
{id:"8-02",p:117,t:"AOV 单代号与 AOE 双代号",c:"顶点=活动→AOV；顶点=事件弧=活动→AOE；PERT=网络图",
x:`以顶点表示活动、弧表示活动之间先后关系的图称为 AOV 网（Activity On Vertex，单代号网络图）——每个工作只用一个节点表示，箭线表示工作之间的逻辑关系；以顶点表示事件、弧表示活动的称为 AOE 网（Activity On Edge，双代号网络图）——以箭线及其两端的节点编号表示工作。软考中看到 PERT 图就想到网络图。架构/系分进度计算真题往往求最短路径，用双代号做比较方便；资源受限调度题（如9人限制）把人数标注在双代号网络图上逐步推演，注意关键路径与人员约束下工期的差别。`,
b:["AOV","顶点表示活动","AOE","顶点表示事件","PERT","双代号"]},
{id:"8-03",p:119,t:"三点估算法",c:"期望＝(乐观＋4×最可能＋悲观)／6",
x:`三点估算法：(1)乐观时间——在任何事情都很顺利的情况下完成某项工作的时间；(2)最可能时间——在正常情况下完成某项工作的时间；(3)悲观时间——在最不利情况下完成某项工作的时间。期望时间＝（乐观时间＋4×最可能时间＋悲观时间）／6。真题计算最基本的工期、总时差一定要学会计算。`,
b:["乐观时间","最可能时间","悲观时间","4","6"]}
]}]};

GROUPS.g4={name:"底层三件",chapters:[
{n:"第9章 计算机组成原理",blocks:[
{id:"9-01",p:125,t:"补码两特点与表示范围",c:"零唯一＋统一加减法；n 位范围 -2^(n-1)～2^(n-1)-1，负数多一个",
x:`补码两个重要特点：①补码中零的表示唯一（0 的补码为 00000000）；②补码可以统一加法和减法运算，减去一个数可以转换为加上该数的补码（进位舍弃）。n 位补码表示范围为 -2^(n-1)～2^(n-1)-1：8 位为 -128～+127，16 位为 -32768～+32767。补码中负数比正数多一个，因为补码取消了"-0"的表示形式，多出的一个编码用于表示最小负数（如 8 位中 10000000 表示 -128 而不是 -0）。`,
b:["唯一","统一加法和减法","-128～+127","-0","最小负数"]},
{id:"9-02",p:126,t:"定点数与浮点数",c:"IEEE754 三部分：符号位＋阶码＋尾数；阶码定范围、尾数定精度",
x:`定点数是小数点位置固定的表示方法，小数点不存储、由系统预先约定位置。浮点数小数点位置可变，类似科学计数法；IEEE754 中为三部分：符号位（数值正负）＋阶码（小数点移动的位置）＋尾数（有效数字）；有的教材拆成四部分：阶符＋阶码＋数符＋尾数。结论：阶码的长度决定浮点数的数值表示范围，尾数的长度决定表示精度。浮点数优点是表示范围大，缺点是精度有限——许多十进制小数不能用有限位二进制精确表示（如 0.1 是无限循环），因此程序中可能出现 0.1+0.2≠0.3 的舍入误差。`,
b:["固定","科学计数法","符号位","阶码","尾数","表示范围","精度","0.1+0.2"]},
{id:"9-03",p:137,t:"CISC vs RISC",c:"CISC 多而变长微程序；RISC 少而定长 Load/Store 硬布线流水线",
x:`CISC（复杂指令系统计算机）：指令数量多，使用频率差别大，可变长格式，支持多种寻址方式，采用微程序控制技术（微码），研制周期长。RISC（精简指令系统计算机）：指令数量少，使用频率接近，定长格式，大部分为单周期指令，以操作寄存器为主、只有 Load/Store 指令操作内存，寻址支持方式少，增加通用寄存器、硬布线逻辑控制为主，适合采用流水线技术，通过优化编译有效支持高级语言。`,
b:["数量多","可变长","微程序","数量少","定长","单周期","Load/Store","硬布线","流水线"]},
{id:"9-04",p:139,t:"流水线三公式",c:"时长=首条顺序+(n-1)×最长段；吞吐率 n/Tk；加速比 T0/Tk",
x:`流水线技术把一项任务分解为若干顺序执行的子任务，不同子任务由不同操作部件并行执行。三个公式：①执行时长＝第一条指令顺序执行时间＋（指令条数-1）×流水线周期，其中周期是各阶段中占最长时间的操作时间（关键）；②吞吐率 TP＝n/Tk（单位时间内完成的任务数），各段执行时间不完全相等时实际吞吐率＝n/(Σti+(n-1)·max(ti))，最大吞吐率＝1/max(t1,t2,…,tk)，即由执行时间最长的功能段决定；③加速比 S＝T0/Tk（顺序执行时间/流水线执行时间）。`,
b:["第一条指令顺序执行时间","最长","1/max","加速比","T0/Tk"]},
{id:"9-05",p:135,t:"总线带宽（赠）",c:"带宽=宽度×频率；总线频率=时钟频率÷每周期占用的时钟数",
x:`总线带宽定义为总线的最大数据传输速率（每秒传输的字节数）：总线带宽＝总线宽度×总线频率。注意总线频率与总线时钟频率是除法关系：如一个总线周期占用2个时钟周期、时钟频率10MHz，则总线频率为10MHz/2=5MHz；总线宽度4B 时带宽为4B×5MHz=20MB/s。`,
b:["总线宽度","总线频率","除法","20MB"]}
]},
{n:"第10章 计算机网络",blocks:[
{id:"10-01",p:143,t:"奈氏准则与香农公式",c:"奈氏：无噪声 2W·log2V；香农：有噪声 W·log2(1+S/N)",
x:`奈氏准则：在带宽为 W（Hz）的理想低通信道（无噪声）中，码元传输的最高速率为 2W（码元/秒）；若是 V 进制码元，极限数据传输率＝2W×log₂V（b/s）。意义：通过更先进的编码技术让每个码元携带更多比特（提高 V）来提高传输速率。香农公式：实际信道存在噪声，有噪声时的极限传输速率 C＝W×log₂(1+S/N)（b/s），其中 S/N 为信噪比，分贝表示：信噪比(dB)＝10×log₁₀(S/N)。香农公式表明：信道带宽越宽、信噪比越大，极限传输速率越高；实际传输速率低于 C 就一定能找到无差错传输的方法，超过 C 则必然出现差错。`,
b:["2W","理想","V","噪声","1+S/N","分贝","无差错"]},
{id:"10-02",p:145,t:"CRC 循环冗余校验计算",c:"多项式系数→二进制；最高次幂=补0个数；模2除法取余",
x:`CRC 校验码计算三步：(1)确定生成多项式对应的二进制码——按各项系数写（有该项为1无为0），如 G(x)=x⁵+x³+x+1 对应 101011；(2)生成多项式最高次幂为几就在信息码字后补几个 0（如最高次幂5则补5个0）；(3)用补0后的码字除以生成多项式对应的二进制码，进行模2除法（异或运算：两值不同结果为1，相同为0），所得余数即 CRC 校验码。`,
b:["系数","101011","补5个0","模2除法","异或","余数"]},
{id:"10-03",p:146,t:"OSI 七层与协议归属",c:"口诀：物联网书会使用；考协议属于哪层",
x:`OSI 七层（口诀"物联网书会使用"：物理、数据链路、网络、传输、会话、表示、应用）。各层常见协议：应用层——HTTP、FTP、SMTP（发邮件）、POP3（收邮件）、DNS、Telnet、SNMP；表示层——数据格式转换、加密解密、数据压缩，协议 SSL/TLS；会话层——建立管理终止会话，协议 NetBIOS、RPC；传输层——端到端数据传输，TCP（面向连接、可靠）、UDP（无连接、快但不保证可靠）；网络层——IP、ICMP、IGMP、ARP（IP→物理地址）、RARP（物理地址→IP）；数据链路层——PPP、HDLC、Ethernet、VLAN、MAC；物理层——RS-232、RJ-45、IEEE802.3、光纤标准。`,
b:["物联网书会使用","SMTP","POP3","SNMP","SSL/TLS","RPC","ARP","RARP","VLAN","RJ-45"]},
{id:"10-04",p:148,t:"TCP/IP 四层与 IPv6",c:"口诀：应传网接；IPv6 固定40字节报头无校验和、强制 IPsec、无需 NAT",
x:`TCP/IP 四层（口诀"应传网接"）：应用层（HTTP、FTP、SMTP、DNS）、传输层（TCP 面向连接可靠、UDP 无连接）、互联网层（IP，及 ICMP、IGMP）、网络接口层。IPv4 vs IPv6 要点：地址分配——IPv4 手动/DHCP，IPv6 无状态地址自动配置（SLAAC）+DHCPv6 可选；报头格式——IPv4 可变长报头（20-60字节）含校验和与分片字段，IPv6 固定40字节报头、无校验和、分片由源端处理；NAT——IPv4 依赖 NAT 解决地址短缺，IPv6 地址充足无需 NAT、支持端到端通信；安全性——IPv4 无内置加密需额外配置 IPsec，IPv6 强制支持 IPsec（AH/ESP 协议）。`,
b:["应传网接","SLAAC","固定40字节","无校验和","源端","无需 NAT","端到端","IPsec"]},
{id:"10-05",p:156,t:"局域网与 Wi-Fi 代际（赠）",c:"覆盖小速率高误码率低；Wi-Fi6 9.6G / Wi-Fi7 46G",
x:`局域网是覆盖范围较小（数百米至数公里）、传输速率高（可达千兆）、误码率低的计算机网络，通常以 PC 为主体，采用简单协议、结构灵活，建网成本低、周期短。Wi-Fi 代际：IEEE 802.11ax（Wi-Fi6，约2019年）工作在 2.4GHz/5GHz（部分支持 6GHz），最高理论速率 9.6Gbps；IEEE 802.11be（Wi-Fi7，2024年）工作在 2.4/5/6GHz，最高可达约 46Gbps。`,
b:["误码率低","802.11ax","Wi-Fi6","9.6Gbps","802.11be","46Gbps"]},
{id:"10-06",p:159,t:"网络互连设备工作层次",c:"物理：中继器集线器；链路：网桥二层交换机；网络：路由器三层交换机；高层：网关",
x:`网络互连设备按工作层次辨析：物理层——中继器（对接收信号再生和发送，扩展传输距离，对高层协议透明，使用个数有限如以太网最多4个）、集线器（多端口中继器）；数据链路层——网桥（根据 MAC 地址进行网络间信息转发，连接相同 MAC 层的网络）、二层交换机（多端口网桥）；网络层——路由器（通过逻辑地址进行网络间信息转发，完成异构网络互连）、三层交换机（带路由功能的二层交换机）；高层（4-7层）——网关（最复杂的网络互联设备，连接网络层以上执行不同协议的子网）。`,
b:["中继器","再生","集线器","多端口中继器","网桥","MAC","二层交换机","路由器","三层交换机","网关"]}
]},
{n:"第11章 操作系统",blocks:[
{id:"11-01",p:162,t:"进程五态与前趋图",c:"口诀：新舅运祖宗；前趋图边=相邻直接联系，不能传递",
x:`进程五种基本状态（口诀"新舅运祖宗"）：新建态（正在创建）、就绪态（具备运行条件只等CPU）、运行态（占有CPU执行）、阻塞态（因等待特定事件暂停，不具备运行条件）、终止态（执行完毕或被终止，保留部分内核区数据用于善后）。前趋图是一个有向无环图，描述进程之间的执行顺序：结点表示进程/程序段/语句，有向边表示偏序或前驱关系；每一对结点必须是相邻关系、有直接联系，不能传递（P1→P2、P2→P5 不能推出 P1→P5）。`,
b:["新舅运祖宗","就绪态","阻塞态","有向无环图","相邻关系","不能传递"]},
{id:"11-02",p:164,t:"进程同步与互斥",c:"同步=按顺序（管道读写）；互斥=独占（打印机临界资源）",
x:`进程同步（按顺序）：在多个进程之间协调执行顺序，保证它们按照既定的顺序共享资源——注重进程执行的先后顺序。例：读进程必须等写进程写满管道才开始读，写进程必须等读进程读完管道数据才开始写。进程互斥（独占）：不同进程间对某些关键资源进行独占访问，某一时刻只有一个进程可访问该资源，其他进程需等待资源释放——聚焦于资源的独占性。例：在一个时间段内只允许一个进程使用的"临界资源"，如打印机等。`,
b:["先后顺序","管道","独占","临界资源","打印机"]},
{id:"11-03",p:164,t:"PV 操作",c:"P 申请(S-1, S<0阻塞)；V 释放(S+1, S≤0唤醒)；S<0 绝对值=等待进程数；前驱完 V、后继始 P",
x:`PV 操作由两个原子操作组成：P（wait，荷兰语 Proberen 测试）和 V（signal，Verhogen 增加）。P 操作：信号量 S 减1，若减后 S≥0 进程继续执行（申请资源，足够则运行），若 S<0 则该进程阻塞、插入阻塞队列（资源不足）。V 操作：信号量 S 加1，若加后 S>0 执行 V 操作的进程继续执行；若 S≤0 则从阻塞状态唤醒一个进程插入就绪队列（释放资源且唤醒等待进程）。考法一：S 的值≥0 时等于当前可用资源数；S<0 时其绝对值表示因申请资源而被阻塞的进程数（如 S=-3 表示 3 个进程在等待）。考法二（前趋图题）：某进程是别人的前驱，则它执行完的位置用 V 操作释放信号量通知后继；某进程是后继，则开始处用 P 操作等待前驱完成。`,
b:["wait","signal","减1","阻塞队列","加1","唤醒","绝对值","阻塞的进程数","V","P"]},
{id:"11-04",p:167,t:"死锁四必要条件",c:"互斥／不剥夺／请求与保持／环路；预防=破坏四条件",
x:`死锁：若干进程竞争资源，每个进程都占有一定资源又申请已被另一进程占用且不能抢占的资源，纷纷进入阻塞状态，两个或两个以上进程无限期等待永远不会发生的条件。产生死锁的4个必要条件：互斥条件——任一时刻只允许一个进程使用资源；不剥夺条件——进程已占用的资源不会被强制剥夺；请求与保持条件——进程请求其余资源时不主动释放已占有的资源；环路条件——环路中每一条边是进程在请求另一个进程已占有的资源。死锁预防针对破坏这4个必要条件进行（选择题爱考）。`,
b:["互斥条件","不剥夺条件","请求与保持条件","环路条件","破坏"]},
{id:"11-05",p:168,t:"页式与段式管理",c:"页=固定大小+页表；段=独立逻辑实体；物理地址=块号×页大小+页内地址",
x:`页式管理：将主存空间和程序逻辑地址划分为固定大小的页面，使用页表将虚拟地址与物理地址转换；每个页面在物理内存中占据一个连续的内存块（页帧）；逻辑地址＝页号＋页内地址。计算：逻辑空间64KB＝2¹⁶→逻辑地址16位；页面1KB＝2¹⁰→页内地址10位；页数64→页号6位。物理地址＝物理块号×页大小＋页内地址。段式管理：把程序逻辑地址空间按段划分，每段是一个独立的逻辑实体，每个段分配一个连续的内存区，各段之间不要求连续；通过查找段表完成映射；逻辑地址＝段号＋段内地址。`,
b:["固定大小","页表","页帧","页号","页内地址","段表","独立的逻辑实体","不要求连续"]},
{id:"11-06",p:170,t:"虚拟内存与页面置换算法",c:"请求调入＋置换；LRU 最久未用／NUR 访问位／最优=未来最长时间不访问",
x:`虚拟存储管理：程序运行前不必全装入内存，可先装入部分启动，其他留外存根据需要调入，内存满时置换——系统具有请求调入和置换功能，大程序可在小内存运行。良好算法应淘汰访问概率低的页。常见淘汰（置换）算法：随机算法——随机选择页面淘汰；轮转算法——按顺序依次循环选择（环形队列）；先进先出（FIFO）——优先淘汰最早进入内存的页面；最近最久未使用（LRU）——选择离当前时间最近一段时间内最久没有使用过的页先淘汰（认为过去久未使用的未来也很可能不被使用）；最近没有使用页面置换（NUR）——为页面设置访问位，访问位为0淘汰、为1清零留观察；最优置换算法——淘汰在未来最长时间内不会被访问的页面（理想情况，实际难实现，作为衡量其他算法性能的参考标准）。`,
b:["请求调入","置换","FIFO","LRU","最久没有使用","NUR","访问位","最优置换","未来最长时间"]},
{id:"11-07",p:172,t:"文件多级索引（赠）",c:"直接0-4；一级间接每块1024/4=256项（5-516）；二级517起",
x:`文件索引节点地址计算（例：5个直接地址索引、磁盘数据块1KB、地址项4字节）：直接地址索引可表示逻辑块号范围0-4；一级间接地址索引——一个索引块能存放的地址项数量为1024/4=256个，两个一级间接索引可表示5-516（512个）；二级间接地址索引从517开始。判断：逻辑块号1在0-4范围内用直接地址索引；逻辑块号518>517用二级间接地址索引。`,
b:["0-4","256","5-516","517","二级间接"]},
{id:"11-08",p:173,t:"磁盘空闲区管理四法",c:"空闲文件目录／空闲块链／位示图／成组链接",
x:`常用的磁盘空闲区管理方法有4种：空闲文件目录、空闲块链、位示图和成组链接法。位示图是利用二进制位表示磁盘块空闲状态的图，每一位对应一个磁盘块，0/1 表示空闲/占用。`,
b:["空闲文件目录","空闲块链","位示图","成组链接法"]}
]}]};

GROUPS.g5={name:"数据库",chapters:[
{n:"第12章 数据库系统",blocks:[
{id:"12-01",p:174,t:"三级模式与两级独立性",c:"口诀：外局改全内务；外=用户局部／概念=DBA全体／内=系统程序员物理",
x:`数据库系统结构典型为三级模式和两级映射。三级模式：外模式——面向用户（程序员和终端用户），是局部数据的逻辑结构和特征的描述，含数据安全性和完整性约束；概念模式——面向数据库管理员，是数据库中全体数据的逻辑结构和特征的描述；内模式——面向系统程序员，描述存储记录的类型、存储域的表示和存储记录的物理顺序，以及索引和存储路径等数据的存储组织。记忆口诀：外局改全内务（外模式局部、概念模式全体、内模式物理顺序）。两级独立性：物理独立性——应用程序与存储在磁盘上的数据相互独立；逻辑独立性——应用程序与数据库的逻辑结构相互独立，逻辑结构改变时应用程序不需要改变。`,
b:["外模式","局部","概念模式","数据库管理员","全体","内模式","系统程序员","物理独立性","逻辑独立性","外局改全内务"]},
{id:"12-02",p:176,t:"关系模型术语",c:"关系=表／元组=行／属性=列／主码唯一确定元组",
x:`关系模型术语：关系（表文件）——一个二维表，由行和列组成；元组（记录）——表中的一行；属性（字段）——表中的每一列，定义数据的意义和数据类型；属性值——行和列交叉点的值；主码（主键）——用于唯一确定表中一个元组的数据，可以是一个或多个字段。`,
b:["二维表","元组","记录","属性","字段","主码"]},
{id:"12-03",p:182,t:"数据库设计四阶段",c:"需求分析→概念设计(ER)→逻辑设计(转关系模式+规范化)→物理设计；概念逻辑最重要",
x:`数据库设计可分为5个阶段（规划、需求分析、概念设计、逻辑设计和物理设计；有教材写6阶段含实施与运行维护），主要关注四块：需求分析——了解和分析用户需求，编写需求说明书，包括数据流图、建立数据字典；概念设计——将用户需求建立抽象的信息模型（概念模型），便于与不熟悉计算机的用户交流，是数据库设计的关键，任务为选择局部应用、逐一设计分ER图和ER图合并；逻辑设计——将概念结构转换为相应数据模型，E-R图转换为关系模式、关系模式规范化、确定完整性约束、确定用户视图、反规范化设计；物理设计——为逻辑数据模型选择高效、最适合的物理结构（存储结构和存储方法），并对时间和空间效率进行评价。其中概念设计、逻辑设计最重要。`,
b:["数据流图","数据字典","概念设计","信息模型","逻辑设计","关系模式","规范化","存储结构"]},
{id:"12-04",p:182,t:"E-R 图三要素与特殊概念",c:"矩形实体／椭圆属性／菱形联系；弱实体、不完全概化 vs 全部概化",
x:`概念设计常用策略：自顶向下进行需求分析、自底向上设计概念结构（先局部 E-R 模型，再合并成全局 E-R，最后优化评审）。E-R 图三要素：实体（型）——矩形框表示；属性——单值属性用椭圆形，多值属性用双实线椭圆，派生属性用虚线椭圆（从基本属性计算得出）；实体之间的联系——菱形框表示，连线上注明联系类型（1:1、1:n 或 m:n）。值得关注的概念：弱实体——依赖于某个实体（强实体）而存在的实体（如订单依赖于用户）；弱关系——仅弱实体才会涉及的关系；不完全概化——父实体的部分实例不属于任何子实体（职业→工程师/老师）；全部概化——父实体的所有实例必须是某个子实体的实例（人→男人/女人）。`,
b:["自底向上","矩形","椭圆","双实线椭圆","多值属性","虚线椭圆","派生属性","菱形","弱实体","不完全概化","全部概化"]},
{id:"12-05",p:184,t:"E-R 图合并：消除冲突与冗余",c:"属性冲突（域+取值）／命名冲突（同名异义异名同义）／结构冲突；冗余属性+冗余联系",
x:`各子系统局部 E-R 图综合成总体 E-R 图：合并——确定各局部 E-R 图的公共实体类型，以其为单位合并得到全局 E-R 图；消除冲突——①属性冲突：包括属性域冲突和取值冲突，需各部门协商解决；②命名冲突：包含同名异义和异名同义，通过讨论协商等行政手段解决；③结构冲突：同一对象在不同应用中抽象不同，同一实体在不同局部 E-R 图中属性个数或排列次序不同，实体间联系在不同局部图中联系类型不同；消除冗余——冗余属性（可由基本数据导出的数据）和冗余联系（可由其他联系导出的联系）。`,
b:["属性冲突","属性域","取值冲突","命名冲突","同名异义","异名同义","结构冲突","冗余属性","冗余联系"]},
{id:"12-06",p:185,t:"E-R 图转关系模式",c:"1:1 两法／1:n 两法（并 n 端）／m:n 一法（独立成表，主码组合）",
x:`E-R 模型向关系模型转换：1:1 联系两种方法——①转换为独立关系模式（属性=各实体主码+联系本身属性，主码是每个实体的主码）；②与一端实体合并（另一实体的主码和联系属性加入该端）。1:n 联系两种方法——①转换为独立关系模式（主码是 n 端实体的主码）；②与 n 端实体对应关系模式合并（联系属性和 1 端主码加入 n 端）。m:n 联系一种方法——转换为独立关系模式（属性=各实体主码+联系本身属性，各实体主码的组合是该关系的主码或主码的一部分），说白话就是把关系独立出来单独成表。`,
b:["独立关系模式","每个实体的主码","一端","n 端实体的主码","n 端","单独成表","组合"]},
{id:"12-07",p:187,t:"函数依赖五类型",c:"平凡 Y⊆X／非平凡／完全（真子集都不行）／部分／传递",
x:`函数依赖 X→Y 的类型：平凡函数依赖——若 X→Y，但 Y⊆X（如 (职工号,性别)→职工号）；非平凡函数依赖——若 X→Y，且 Y⊈X（如 (职工号,姓名)→性别）；完全函数依赖——X→Y，且对 X 的任何一个真子集 X' 都有 X'↛Y（如只有(职称,课程号)共同才能决定课时费）；部分函数依赖——X→Y 但 Y 不完全函数依赖于 X（如 (教工号,课程号)→姓名，教工号单独就能决定姓名，课程号多余）；传递函数依赖——X→Y，Y→Z，且 Y↛X、Z⊈Y（如学号→系号，系号→系名，系名传递依赖于学号）。考法：给例子用代入法分析谁决定谁。`,
b:["平凡","子集","非平凡","完全函数依赖","真子集","部分函数依赖","多余","传递函数依赖"]},
{id:"12-08",p:190,t:"不规范四大异常（案例至少8分）",c:"口诀：绒绣茶山（冗余／修改／插入／删除）",
x:`不满足规范化的关系模式存在四大异常（案例一旦出现至少8分，需熟记场景）：数据冗余——相同数据在关系中多次重复出现（某课程100个学生选修，任课教师姓名和地址重复出现100次）；修改异常——因数据冗余，修改数据时需多处修改，否则导致数据不一致（修改教师地址需修改100个元组）；插入异常——因部分信息缺失，相关数据无法正常插入（不知道听课学生名单时，教师任课情况无法入库，或需插入空值）；删除异常——删除某类数据时意外删除其他不应删除的数据（删除某门课程任课教师信息时，学生信息也被删除）。记忆口诀：绒绣茶山——绒（冗余）绣（修改）茶（插入）山（删除）。`,
b:["数据冗余","修改异常","不一致","插入异常","空值","删除异常","绒绣茶山"]},
{id:"12-09",p:191,t:"键/码/属性与求候选键图示法",c:"超码可冗余→候选码无多余；入度0能遍历全图=候选键",
x:`键/码/属性：主键/码——被设计者选中用于区分不同实体的候选码，一个实体集仅有一个主码；超码——能唯一标识实体的属性集合，可能含多余属性；候选码——超码的任一真子集不能成为超码（不包含多余属性）；主属性——包含在任一候选码中的属性；非主属性——不包含在任一候选码中的属性。求候选键图示法（送分题，必须掌握）：(1)将函数依赖用有向图表示（顶点=属性，弧=依赖）；(2)找入度为0的属性集，以它为起点遍历有向图，若能遍历所有结点则该属性集即候选键；若不能，则尝试将中间顶点（既有入度也有出度）并入入度0属性集，直至能遍历所有顶点。`,
b:["超码","多余属性","候选码","主属性","非主属性","入度为0","遍历","中间顶点"]},
{id:"12-10",p:192,t:"五大范式（24年系分考过 BCNF）",c:"口诀：一无重复，二主键独，三无传递，BCNF左侧码，四多值除",
x:`五大范式（先找主键再判断！口诀：一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除）：1NF——所有属性只包含原子值，每个分量不可再分（"高级职称人数"拆为"教授""副教授"）；2NF——满足1NF且不存在非主属性对候选码的部分函数依赖（推论：候选码都是单码则必满足）；3NF——满足1NF且不存在非主属性对候选码的传递函数依赖（推论：不存在非主属性的关系模式一定为3NF）；BCNF——任何函数依赖的左侧必须是码（候选码），不能存在非码属性在左侧（例：授课(教工号,学号,课程号)中教工号→课程号但教工号不是码，不满足BCNF，分解为(学号,教工号)和(教工号,课程号)）；4NF——BCNF 的推广，针对多值依赖，把一个表中多个多值依赖拆分开（职工(编号,孩子,课程)拆为(编号,孩子)和(编号,课程)）。`,
b:["原子值","不可再分","部分函数依赖","单码","传递函数依赖","非主属性","左侧必须是码","多值依赖","拆分"]},
{id:"12-11",p:197,t:"事务 ACID",c:"原子／一致／隔离（可串行性）／持久（永久性）",
x:`事务是用户定义的一个数据库操作序列，这些操作要么全做要么全不做，是不可分割的工作单位，是 DBMS 运行的基本工作单位。ACID 四特性：原子性（Atomicity）——事务包含的一组更新操作是原子不可分的整体，要么全部执行成功要么全部不执行；一致性（Consistency）——使数据库从一个一致性状态变到另一个一致性状态（转账中各账户金额必须平衡）；隔离性（Isolation）——一个事务的执行不能被其他事务干扰，并发执行的事务之间不能互相干扰，看上去像每个事务按串行调度执行（也称可串行性）；持久性（Durability）——也称永久性，事务一旦提交，改变就是永久的，无论发生何种故障都不应受影响。`,
b:["要么全做要么全不做","原子性","一致性","隔离性","可串行性","持久性","永久性"]},
{id:"12-12",p:198,t:"并发四大不一致",c:"丢失修改(写覆盖)／脏数据(读回滚)／不可重复读(读更新)／幻读(读插入)",
x:`并发操作带来的数据不一致问题：丢失修改（写覆盖）——事务A与B读入同一数据并修改，B的提交结果破坏了A提交的结果（T1读A、T2读A、T1写A=A-5、T2写A=A-8，前者的修改被覆盖丢失）；读"脏数据"（读回滚）——A修改数据写回磁盘后B读取，随后A被撤销恢复原值，B读到的与数据库不一致（A=20改70，T2读70，T1撤销回20，70即脏数据）；不可重复读（读更新）——A读取数据后B执行更新并写回，A再次读取时前后两次结果变化；幻读（读插入）——A读取某范围数据后，B在此范围内插入新数据，A再次读取该范围时结果比第一次多（本质上也属于不可重复读，只不过是插入导致的）。`,
b:["丢失修改","覆盖","脏数据","撤销","不可重复读","更新","幻读","插入"]},
{id:"12-13",p:200,t:"封锁技术与三级协议",c:"X排他S共享；一级防丢失／二级防脏／三级保可重复读；两段锁可串行化但可能死锁",
x:`处理并发控制的主要方法是封锁技术：X封锁（排他型）——只允许一个事务独占某数据，事务T可读取和修改，其他事务在解除前不能进行任何类型的封锁；S封锁（共享型）——允许并发读但不允许修改，所有S封锁解除前任何事务不能实现X封锁。三级封锁协议：一级——事务T在修改数据R之前必须先对其加X锁，直到事务结束才释放；防止丢失修改，保证事务可恢复；不能保证可重复读和不读"脏数据"（关键漏洞：T1读数据→T2加X锁改数据释放→T1再读）。二级——在一级基础上，读取数据R之前先加S锁，读完后即可释放；防止丢失修改、防止读"脏数据"；不能保证可重复读。三级——在一级基础上，读前加S锁直到事务结束才释放；防止丢失修改、读"脏数据"，能保证可重复读。两段锁协议——所有事务分两阶段：扩展阶段（读写前先申请并获得封锁）、收缩阶段（释放一个封锁后不能再申请任何其他封锁）；若并发执行的所有事务均遵守，则任何并发调度策略都是可串行化的，但可能发生死锁。封锁粒度：粒度小则并发性高但开销大，粒度大则并发性低但开销小。`,
b:["X封锁","排他","S封锁","并发读","一级","X锁","丢失修改","二级","脏数据","三级","可重复读","两段锁","可串行化","死锁"]},
{id:"12-14",p:201,t:"反规范化",c:"增冗余／重定义实体／水平垂直分割；代价：冗余+更新插入删除异常",
x:`反规范化（非规范化）可以改善系统性能，设计时可合理增加冗余属性。提升性能的措施：①增加冗余属性——将常用的计算属性（如总计、最大值等）存储到数据库实体中；②重新定义实体，以减少外部属性数据或行数据的开支；③将关系进行水平或垂直分割，以提升并行访问度。反规范化带来的问题：数据冗余增加（相同数据在多个地方重复存储）；更新异常（更新一处可能遗漏其他重复存储处，导致数据不一致）；插入异常（可能需先插入不必要数据）；删除异常（删除某些数据可能意外删除其他有用信息）。`,
b:["冗余属性","总计","最大值","重新定义实体","水平或垂直分割","更新异常","数据不一致"]},
{id:"12-15",p:202,t:"索引优化准则（案例默写）",c:"常查询不常更新；索引过多拖累增删改；小表不建",
x:`索引建立与选择准则：①索引选用属性原则——选用经常作为查询、不常更新的属性建立索引；避免对常更新属性建立索引（严重影响性能）；②索引数量影响——关系上索引过多会影响 UPDATE、INSERT 和 DELETE 的性能，因关系更新时所有索引都需相应调整；③索引优化策略——分析每个重要查询的使用频度，找出使用最多的索引并进行优化；④小数据量关系处理——数据量非常小的关系不必建立索引，关系扫描更快且消耗系统资源更少。`,
b:["经常作为查询","不常更新","UPDATE","INSERT","DELETE","使用频度","非常小","不必建立索引"]},
{id:"12-16",p:202,t:"完整性约束四手段",c:"实体=主属性非空／参照=外键（级联受限置空递归）／触发器不能对SELECT／用户定义",
x:`数据库完整性约束：实体完整性——关系的主属性（主码/主键的组成）不能为空值（NULL）；参照完整性——若基本关系R中含有与另一基本关系S的主键PK相对应的属性组FK（外键），则R中每个元组在FK上的值必须是S中某个元组的PK值或者为空值（插入删除处理：级联/受限/置空/递归）；触发器——当指定数据操作语句（INSERT、UPDATE、DELETE 触发事件）发生时自动执行一个或多个 SQL 语句的数据库对象（不能直接对 SELECT 定义触发器，因为 SELECT 只是读取数据不改变表的状态）；用户定义完整性——针对特定应用定义的约束条件（如员工年龄必须在18-60岁之间）。`,
b:["主属性","空值","外键","PK值","级联","触发器","SELECT","用户定义"]},
{id:"12-17",p:203,t:"触发器语法与 NEW/OLD",c:"BEFORE/AFTER × INSERT/UPDATE/DELETE；INSERT 只 NEW，UPDATE 有 OLD+NEW",
x:`MySQL 触发器语法：CREATE TRIGGER trigger_name {BEFORE|AFTER} {INSERT|UPDATE|DELETE} ON table_name FOR EACH ROW [trigger_body]。示例：CREATE TRIGGER before_insert_user BEFORE INSERT ON users FOR EACH ROW BEGIN SET NEW.create_time=NOW(); END。触发器中通过虚拟表访问行数据：INSERT 触发器只能用 NEW.column_name（新插入的值）；UPDATE 触发器可以用 OLD.column_name（更新前的值）和 NEW.column_name（更新后的值）。`,
b:["BEFORE","AFTER","FOR EACH ROW","NEW","OLD","更新前","更新后"]}
]}]};

GROUPS.g6={name:"安全·嵌入·法规",chapters:[
{n:"第13章 信息安全",blocks:[
{id:"13-01",p:208,t:"等级保护五级（赠）",c:"一二三级看适用对象递升；四级中央级、五级国防",
x:`信息安全等级保护5个等级：用户自主保护级（第一级）——通过隔离用户与数据实现自主安全保护，适用普通内联网用户；系统审计保护级（第二级）——更细粒度自主访问控制，用户通过登录规程等对自身行为负责，适用需保密的非重要单位；安全标记保护级（第三级）——提供安全策略模型、数据标记，适用地方各级国家机关、金融机构等众多重要单位；结构化保护级（第四级）——基于形式化安全策略模型，访问控制扩展到所有主体与客体，考虑隐蔽通道、抗渗透，适用中央级国家机关、广播电视部门等关键部门；访问验证保护级（第五级）——满足访问监控器需求，仲裁主体对客体全部访问，抗篡改，适用国防关键部门和依法需特殊隔离的单位。`,
b:["用户自主保护","系统审计保护","安全标记保护","金融机构","结构化保护","中央级","隐蔽通道","访问验证保护","国防"]},
{id:"13-02",p:209,t:"加密算法表（对称+非对称）",c:"AES 最常用；3DES 真题写112位；RSA 大数分解；ECC 密钥更短",
x:`对称加密算法：AES——128/192/256位，目前最常用、最安全的对称加密算法之一；DES——56位，密钥短安全性低，老旧系统仍有；3DES——三次DES加密，密钥长度相对较长但速度慢，真题说密钥长度是112位（从有效安全位角度），碰到写112位；RC-5——可变（0-2040位，常用128位），加密轮数可变；IDEA——128位，明文密文都是64位。非对称加密算法：RSA——1024/2048位，安全性基于大整数分解的数学难题，可用于数字签名和密钥交换；ECC——160-521位，与RSA相同安全级别下密钥长度更短、计算效率更高、占用存储空间更小。`,
b:["AES","128/192/256","56位","112位","RC-5","大整数分解","ECC","更短"]},
{id:"13-03",p:210,t:"国产商用密码 SM 系列",c:"SM1/SM4/SM7 分组，SM2/SM9 非对称，SM3 杂凑，ZUC 流加密",
x:`国产商用密码：SM1——分组加密算法，128位分组和密钥，安全性与AES相当，以IP核形式存在于加密芯片中；SM2——基于椭圆曲线的非对称加密算法，256位密钥，支持数字签名、密钥交换和公钥加密，旨在替代RSA、ECDSA和ECDH；SM3——密码杂凑算法，适用于数字签名、消息认证和随机数生成，用于替代MD5、SHA-1和SHA-2；SM4——分组加密算法，128位密钥长度和分组长度，用于替代DES和AES；SM7——分组加密算法，适用于非接触IC卡应用（身份识别、票务和支付）；SM9——基于标识的非对称密码算法，可替代基于数字证书的PKI/CA体系，主要用于用户身份认证；祖冲之密码算法（ZUC）——流加密算法，含加密算法128-EEA3和完整性算法128-EIA3，适用于3GPP LTE通信。`,
b:["SM1","IP核","SM2","椭圆曲线","替代RSA","SM3","杂凑","SM4","SM7","非接触IC卡","SM9","标识","ZUC","流加密"]},
{id:"13-04",p:210,t:"认证技术总览",c:"数字签名／杂凑／数字证书／身份认证（口令、动态、生物）",
x:`认证技术主要用于确认用户、设备或数据的真实性与合法性，保证身份确认、数据完整性、防伪造和防抵赖。分类：数字签名——附加在数据单元上的数据或密码变换，基于非对称加密算法，主要功能是保证信息传输完整性、发送者身份认证和防止抵赖；杂凑算法——利用散列函数加密，MD5将任意长度字节串变成定长大数，产生128位消息摘要，SHA家族对长度不超过2⁶⁴位消息产生160位消息摘要；数字证书——由认证中心签发对用户公钥的认证，内容包括CA及用户信息、公钥、时间等，国际上遵从X.509体系标准，不同CA发放证书需证书链通信，CA维护证书吊销列表；身份认证——口令认证（简单常用但不安全）、动态口令认证（一次一密较安全但有同步问题）、生物特征识别（身体特征和行为特征）。`,
b:["防抵赖","128位","160位","X.509","证书链","吊销列表","一次一密","生物特征"]},
{id:"13-05",p:211,t:"Hash 算法四大特性",c:"易压缩／单向／高灵敏／抗碰撞",
x:`Hash（散列/杂凑）算法的主要特性：易压缩性——可将任意长度的数据映射为固定长度的输出；单向性——从源数据得到哈希值容易，但无法由哈希值推回源数据；高灵敏性——输入数据发生微小变化，输出结果会有显著差异；抗碰撞性——不同输入得到相同哈希值的概率极低。常用算法：SHA-1、SHA-256、SHA-384 以及我国的 SM3；由于计算能力的提升，SHA-1 已被证明存在安全风险，逐步退出历史舞台。Hash 算法非常适合用于数据完整性校验，是数字签名的重要组成部分。`,
b:["易压缩性","固定长度","单向性","高灵敏性","抗碰撞性","SHA-1","完整性校验"]},
{id:"13-06",p:212,t:"数字签名工作原理",c:"签名=Hash后私钥加密摘要；验证=两个摘要比较；只签Hash值不签文件",
x:`数字签名的创建过程：①对需要签名的文件进行 Hash 计算得到消息摘要；②使用签名者的私钥对消息摘要加密，生成数字签名；③可加入时间戳标识签名创建时间；④最终发送内容包括原始文件和数字签名。注意：数字签名只对文件的 Hash 值进行签名，而不是直接对整个文件签名，既节约资源又提高效率。验证过程：①接收方对收到的原始文件进行 Hash 计算得到本地摘要；②使用签名者的公钥解密数字签名，得到发送时的摘要；③比较两个摘要——一致则文件完整且签名有效，不一致则文件被篡改或签名无效。`,
b:["消息摘要","私钥","时间戳","Hash 值","公钥","比较","篡改"]},
{id:"13-07",p:212,t:"数字证书与 CA、公私钥两场景",c:"CA 用私钥签公钥；信源验证=私钥签公钥验；加密=公钥加密对称密钥",
x:`数字证书解决"如何确保公钥确实属于发送者"的问题：CA 充当信任的第三方，验证公钥的归属关系，并通过自己的私钥对公钥及其相关信息进行加密生成数字证书；接收方通过 CA 的公钥解密证书验证公钥的真实性。典型过程：客户端发起加密通信请求→服务器返回数字证书并用私钥加密信息→客户端用CA公钥解密证书验证有效性→用服务器公钥加密敏感信息交换数据。公私钥两大使用场景：①信源验证场景——私钥加密信息（摘要）形成数字签名，公钥用于解密并比对摘要，匹配说明信源可靠；②加密场景——非对称加密效率低、对称加密效率高但需约定密钥，客户端用公钥加密双方通信所需的对称密钥传给服务端，服务端用私钥解密拿到密钥。`,
b:["信任的第三方","私钥","公钥","真实性","信源验证","对称密钥","效率低"]}
]},
{n:"第14章 嵌入式系统",blocks:[
{id:"14-01",p:217,t:"嵌入式系统定义与五特点",c:"应用为中心＋计算机为基础＋可裁剪；专用／实时／资源受限／依赖／透明",
x:`嵌入式系统是以应用为中心、以计算机技术为基础，软硬件可以根据具体需求进行配置和裁剪的专用计算机系统，嵌入到具体设备或业务场景中完成特定功能（汽车电子控制单元、智能家电控制器、工业控制设备、医疗监护设备、航空航天飞控系统）。设计时要同时考虑功能、可靠性、成本、体积和功耗等因素，体现"软硬件一体化设计"。五大主要特点：①专用性强——面向特定任务设计；②实时性强——必须在规定时间内完成响应；③资源受限——CPU、内存、存储和接口资源通常有限；④软硬件依赖性强——软件需结合具体芯片、接口和外设开发优化；⑤系统透明性强——用户感知不到其中的计算机系统。`,
b:["应用为中心","裁剪","专用性强","实时性强","资源受限","依赖性强","透明性"]},
{id:"14-02",p:218,t:"嵌入式四层架构",c:"硬件层／中间层BSP-HAL／系统软件层RTOS／应用层",
x:`嵌入式系统从架构角度分为四层：硬件层——嵌入式处理器、存储器（SDRAM、ROM、Flash）、通用设备接口和 I/O 接口，以及电源电路、时钟电路、复位电路、通信接口、A/D 转换、D/A 转换等；中间层——也称硬件抽象层 HAL 或板级支持包 BSP，负责屏蔽底层硬件差异、把硬件能力封装成上层软件可调用的接口，通常包含硬件初始化、设备驱动、输入输出操作、硬件配置；系统软件层——嵌入式操作系统、文件系统、图形用户接口、网络协议栈、嵌入式数据库及通用组件，实时多任务操作系统 RTOS 提供任务调度、中断管理、定时器、任务通信、资源管理；应用层——直接实现业务功能的软件（智能门锁的指纹识别、汽车的发动机控制等）。`,
b:["硬件层","中间层","HAL","BSP","屏蔽","硬件初始化","系统软件层","RTOS","任务调度","应用层"]},
{id:"14-03",p:219,t:"嵌入式数据库四特点",c:"嵌入性／实时性／移动性（离线同步）／伸缩性（裁剪）",
x:`嵌入式数据库管理系统（EDBMS）是运行在嵌入式系统中，用于存储、管理和访问数据的数据库管理系统，通常与嵌入式操作系统和应用软件集成在一起。特点四方面：①嵌入性——不是独立运行的大型数据库服务器，而是嵌入到软件或硬件设备中，用户一般不会直接感知它的存在；②实时性——要求在限定时间内完成读写和响应，否则即使结果正确也可能失去实际意义；③移动性——常用于手机、车载设备、移动采集终端等，可能处于网络不稳定甚至离线环境，需要支持本地缓存、离线使用和数据同步；④伸缩性——不同设备资源差异较大，需要具备裁剪和配置能力以适应不同平台。`,
b:["EDBMS","嵌入性","实时性","移动性","离线","数据同步","伸缩性","裁剪"]},
{id:"14-04",p:220,t:"嵌入式数据库系统组成四件",c:"本地库＋同步服务器（枢纽）＋数据库服务器（主库）＋连接网络",
x:`一个完整的嵌入式数据库系统通常由四部分组成：①嵌入式数据库——运行在移动设备或嵌入式设备本地，管理设备端数据，可在没有网络的情况下独立运行，支持本地数据的存储、查询和更新；②同步服务器——嵌入式数据库和主数据库之间的连接枢纽，核心作用是完成数据同步，保证设备端数据库和服务器端主数据库的数据尽量保持一致；③数据库服务器——保存主数据库，通常运行大型通用数据库管理系统，集中管理核心业务数据，设备上的本地数据库通常只是主数据库的一个局部副本或工作副本；④连接网络——数据库服务器和同步服务器之间一般使用较稳定的固定网络，移动设备和同步服务器之间可能使用无线局域网、蜂窝网络、串口、红外等。`,
b:["独立运行","同步服务器","连接枢纽","保持一致","数据库服务器","主数据库","局部副本","固定网络"]},
{id:"14-05",p:221,t:"EOS 分类与三种内核",c:"硬实时（错过截止=严重后果）vs 软实时（体验下降）；宏／微／混合内核",
x:`嵌入式操作系统（EOS）按实时性分两类：硬实时操作系统——任务必须在规定时间内完成，一旦错过截止时间即使计算结果正确也可能造成严重后果（控制、通信、航空航天、工业控制、汽车电子，如汽车制动控制、飞行控制）；软实时操作系统——偶尔超时通常只造成体验下降不一定导致系统失败（消费电子、智能终端、机顶盒、手机，如界面卡顿、视频掉帧）。内核结构三种：宏内核——很多系统服务都放在内核空间运行（进程管理、内存管理、文件系统、设备驱动），优点是系统调用开销小、性能和实时性较好，缺点是耦合度高、出问题影响整个内核、可移植性差；微内核——只把最基本功能放内核中，其他服务放用户空间，优点是结构清晰、模块隔离好、可移植性和扩展性强，缺点是不同服务之间需频繁通过消息通信影响性能；混合内核——保留微内核结构思想，但把一些常用或性能敏感的服务放回内核空间，是折中设计。`,
b:["硬实时","截止时间","严重后果","软实时","体验下降","宏内核","系统调用开销","微内核","消息通信","混合内核","折中"]},
{id:"14-06",p:223,t:"多任务调度算法",c:"优先级抢占／时间轮转（同优先级）／RMS 周期短优先高／EDF 截止近优先高",
x:`典型调度算法：优先级的抢占调度——任何时候系统都运行所有就绪任务中优先级最高的任务，更高优先级任务就绪即可抢占低优先级任务的 CPU；优先级分静态（设计时确定不变）和动态（运行中根据任务状态、截止时间调整）。时间轮转调度——主要用于同优先级任务之间：每个任务分配一个时间片，运行完一个时间片后让出 CPU 排到同优先级就绪队列尾部；时间片太大轮转效果不明显，太小任务切换过于频繁 CPU 开销增大；实际常用基于优先级的抢占式时间轮转调度（不同优先级按优先级抢占，同一优先级内部按时间片轮转）。RMS 单调速率调度——静态固定优先级算法，适用于周期性实时任务，核心规则：任务周期越短优先级越高。EDF 截止时间优先调度——动态优先级算法，核心规则：截止时间越近优先级越高，新任务截止时间更早可抢占当前任务。`,
b:["最高","抢占","时间片","同优先级","轮转","周期越短","静态","截止时间越近","动态"]}
]},
{n:"第15章 法律法规",blocks:[
{id:"15-01",p:227,t:"保护对象与是否需申请",c:"著作权软件著作权完成即保护；专利申请日；商标核准日；商业秘密须保密措施",
x:`保护对象：著作权法——文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果，不需要申请，作品完成即开始保护（绘画或摄影作品原件出售后著作权仍归原作者，原件拥有者有所有权、展览权）；计算机软件保护条例——软件作品包括计算机程序及其有关文档，不需要申请，作品完成即开始保护，登记制度便于举证；专利法——发明创造包括发明、实用新型和外观设计，需要申请，专利权有效期从申请日开始计算；商标法——商标，需要申请，核准之日起受保护；反不正当竞争法——商业秘密包括技术与经营两个方面，必须有保密措施才能认定。著作权法不适用于：法律法规及官方文件、时事新闻、历法、通用数表、通用表格和公式。开发软件所用的思想、处理过程、操作方法或数学概念不受保护；软件作品指带有特定业务逻辑的程序以及软件文档。`,
b:["完成即开始保护","展览权","程序及其有关文档","登记","申请日","核准之日","保密措施","时事新闻","数学概念"]},
{id:"15-02",p:228,t:"保护期限",c:"署名权无限；公民终身+死后50年；商标10年；发明20/实用新型10/外观15",
x:`保护期限：公民作品——署名权、修改权、保护作品完整权没有限制；发表权、使用权和获得报酬权为作者终生及其死亡后的50年（第50年的12月31日）。单位作品——发表权、使用权和报酬权为首次发表后的第50年。公民软件作品——署名权、修改权没有限制；其他为作者终生及死后50年（合作开发以最后死亡作者为准）。注册商标——有效期10年（期满后6个月内必须续注）。发明专利保护期20年（从申请日开始）；实用新型10年；外观设计专利权15年（均从申请日开始）。商业秘密——不确定，公开后公众可用。`,
b:["没有限制","50年","首次发表后","10年","6个月","20年","15年","申请日"]},
{id:"15-03",p:228,t:"职务作品与产权归属",c:"职务=单位（署名权除外）；委托默认创作方；合作共同；先申请先得；署名权永久",
x:`职务作品归属：作品——利用单位的技术条件进行创作，或合同约定著作权属于单位，归单位（署名权除外）；其他情况作者拥有著作权，单位有权在业务范围内优先使用。软件——本职工作明确的开发目标、属于从事本职工作活动的结果、使用单位资源并由单位承担责任，均归单位（署名权除外）。专利——本职工作中作出的发明创造、履行本单位本职工作之外的发明创造、离职退休或调动工作后一年内与原单位工作相关，均归单位。委托创作——默认归创作方，可以约定给委托方；合作开发——共同享有。商标——谁先申请谁拥有（除知名商标的非法抢注），同一天申请则谁先使用（需提供证据），无法提供证据协商归属，无效时抽签。专利——谁先申请谁拥有，同一天申请则协商归属，但不能同时驳回双方的专利申请。真题要点：署名权是开发者的永久权利（人身权），不管是否离职都不能被替换（项目负责人把开发者丁某署名替换为王某侵犯署名权）。`,
b:["署名权除外","业务范围","一年内","创作方","共同享有","谁先申请","抽签","永久","离职"]},
{id:"15-04",p:230,t:"侵权判定",c:"不侵权：个人学习／适量引用／室外临摹／盲文少数民族；侵权：未许可发表／未参与署名／歪曲",
x:`不侵权场景：个人用于自身学习、探究或品鉴；进行适度的援引；有关公开演讲的内容；应用于教学或科学探究；对馆藏作品进行复制；无偿表演他人的作品（合理使用范畴）；在室外公共场合对艺术品进行临摹、绘画、拍摄、录像；把汉语作品翻译为少数民族语言作品或以盲文形式出版。侵权场景：在未获得许可的情况下对他人作品进行发表；未得合作作者应允把合作创作作品当独自创作作品发表；没有参与创作却在他人作品中署名；对他人作品进行歪曲、修改；窃取他人作品；运用他人作品时没有支付相应报酬；未取得出版者同意使用其图书、期刊的版式设计。`,
b:["个人","适度的援引","室外公共场合","盲文","未获得许可","署名","歪曲","报酬","版式设计"]},
{id:"15-05",p:230,t:"专利法三客体",c:"发明=技术方案／实用新型=形状构造／外观设计=形状图案色彩",
x:`专利法的客体是发明创造，即其保护的对象，指发明、实用新型和外观设计：发明——对产品、方法或者其改进所提出的新的技术方案；实用新型——对产品的形状、构造及其组合，提出的适于实用的新的技术方案；外观设计——对产品的形状、图案及其组合，以及色彩与形状、图案的结合所作出的富有美感并适于工业应用的新设计。`,

/* ============ 引擎：与 /recite.html 同款交互（挖空判分 + 艾宾浩斯复习） ============ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function cloze(text,blanks){
  var h=esc(text);
  var marks=blanks.map(function(w,i){return [w,"@@B"+i+"@@"]});
  marks.sort(function(a,b){return b[0].length-a[0].length});
  marks.forEach(function(p){h=h.split(esc(p[0])).join(p[1])});
  marks.forEach(function(p){
    var sp='<span class="bl" data-a="'+esc(p[0])+'" onclick="rv(this)">?</span>';
    h=h.split(p[1]).join(sp);
  });
  return h.replace(/\n/g,"<br>");
}
function norm(s){return s.replace(/\s/g,"").replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)})}
function recAns(a,ok){
  try{
    var st=JSON.parse(localStorage.getItem("rb-cloze")||"{}");
    st[a]=st[a]||{hit:0,miss:0};
    st[a][ok?"hit":"miss"]++;
    localStorage.setItem("rb-cloze",JSON.stringify(st));
    clozeStat=st;
  }catch(e){}
}
function rv(el){
  if(el.classList.contains("open")||el.querySelector("input"))return;
  var a=el.dataset.a;
  el.innerHTML='<input placeholder="?"><i class="peek" title="直接看答案">👁</i>';
  var inp=el.querySelector("input");
  inp.focus();
  inp.addEventListener("click",function(e){e.stopPropagation()});
  inp.addEventListener("keydown",function(e){
    if(e.key!=="Enter")return;
    var ok=norm(inp.value)===norm(a);
    el.classList.add("open",ok?"hit":"miss");
    el.textContent=a;
    if(!ok)el.title="你写的是："+inp.value;
    recAns(a,ok);
  });
  el.querySelector(".peek").addEventListener("click",function(e){
    e.stopPropagation();
    el.classList.add("open");el.textContent=a;
  });
}
function revealAll(btn){
  var box=btn.closest(".card").querySelector(".txt");
  box.querySelectorAll(".bl").forEach(function(el){el.textContent=el.dataset.a;el.classList.add("open")});
}
function wc(s){return s.replace(/\s/g,"").length}
var done={};
try{done=JSON.parse(localStorage.getItem("rb-done")||"{}")}catch(e){}
function saveDone(){try{localStorage.setItem("rb-done",JSON.stringify(done))}catch(e){}}
var REV_STEPS=[1,3,7];
function reviewInfo(ts){
  var days=(Date.now()-ts)/864e5;
  if(days<REV_STEPS[0])return null;
  var lv=0;REV_STEPS.forEach(function(s){if(days>=s)lv=s});
  return {days:Math.floor(days),lv:lv,done:lv>=7};
}
var clozeStat={};
try{clozeStat=JSON.parse(localStorage.getItem("rb-cloze")||"{}")}catch(e){}
function blockMiss(bk){
  var n=0;bk.b.forEach(function(w){var s=clozeStat[w];if(s)n+=s.miss});
  return n;
}
var TAB=null,FILTER=false;
function groupBlocks(g){var r=[];g.chapters.forEach(function(c){r=r.concat(c.blocks)});return r}
function render(){
  var app=document.getElementById("app");
  var g=GROUPS[TAB],dn=done[TAB]||{};
  var blocks=groupBlocks(g);
  var dnIds=Object.keys(dn);
  var revN=0;
  blocks.forEach(function(bk){
    var ts=dn[bk.id],ri=ts?reviewInfo(ts):null;
    if((ri&&!ri.done)||blockMiss(bk)>0)revN++;
  });
  var head='<div class="bar"><i style="width:'+(dnIds.length/blocks.length*100)+'%"></i></div>'+
    '<div class="pt"><span>'+g.name+' · 背熟 <b>'+dnIds.length+'</b>/'+blocks.length+'</span>'+
    '<span style="display:flex;gap:8px;align-items:center">'+
    '<label class="ckb"><input type="checkbox" '+(FILTER?"checked":"")+' onchange="FILTER=this.checked;render()">只看待复习/错锚点'+(revN?"("+revN+")":"")+'</label>'+
    '<button class="hbtn" onclick="resetDone(\''+TAB+'\')">重置</button></span></div>';
  var body="";
  g.chapters.forEach(function(ch){
    var cards=ch.blocks.filter(function(bk){
      if(!FILTER)return true;
      var ts=dn[bk.id],ri=ts?reviewInfo(ts):null;
      return (ri&&!ri.done)||blockMiss(bk)>0;
    });
    if(!cards.length)return;
    var chDone=ch.blocks.filter(function(bk){return dn[bk.id]}).length;
    body+='<h2>'+ch.n+'<span class="hn">'+chDone+'/'+ch.blocks.length+'</span></h2>';
    body+=cards.map(function(bk){
      var ts=dn[bk.id],isD=!!ts;
      var ri=isD?reviewInfo(ts):null;
      var needRev=ri&&!ri.done;
      var miss=blockMiss(bk);
      var badges='';
      if(needRev)badges+='<span class="bdg bdg-rev">待复习·第'+ri.days+'天</span>';
      if(miss>0)badges+='<span class="bdg bdg-miss">锚点错'+miss+'次</span>';
      return '<div class="card'+(isD?" done":"")+(needRev?" review":"")+'" id="c-'+bk.id+'">'+
        '<h3>'+(isD?"✅ ":"▫️ ")+bk.t+badges+'<span class="n">'+wc(bk.x)+'字 · p'+bk.p+'</span></h3>'+
        '<p class="cue">'+bk.c.replace(/\n/g,"<br>")+'</p>'+
        '<div class="btns">'+
          '<button onclick="showTxt(this,\''+bk.id+'\',\'full\')">全文</button>'+
          '<button onclick="showTxt(this,\''+bk.id+'\',\'cloze\')">填空</button>'+
          '<button class="'+(isD?"dk":"")+'" onclick="tg(\''+bk.id+'\')">'+(isD?(needRev?"✓ 复习完成":"取消背熟"):"✓ 已背熟")+'</button>'+
        '</div>'+
        '<div class="txt" id="t-'+bk.id+'"></div></div>';
    }).join("");
  });
  app.innerHTML=head+body;
}
function showTxt(btn,id,mode){
  var box=document.getElementById("t-"+id);
  var bk=null;
  GROUPS[TAB].chapters.forEach(function(c){c.blocks.forEach(function(x){if(x.id===id)bk=x})});
  var wasOn=box.style.display==="block"&&box.dataset.m===mode;
  box.style.display=wasOn?"none":"block";box.dataset.m=mode;
  box.innerHTML=mode==="full"?esc(bk.x).replace(/\n/g,"<br>"):cloze(bk.x,bk.b)+
    '<div class="btns"><button onclick="revealAll(this)">揭示全部</button></div>';
  btn.closest(".btns").querySelectorAll("button").forEach(function(x){x.classList.remove("on")});
  if(!wasOn)btn.classList.add("on");
}
function tg(id){
  done[TAB]=done[TAB]||{};
  if(done[TAB][id]){
    var ri=reviewInfo(done[TAB][id]);
    if(ri&&!ri.done){
      done[TAB][id]=Date.now();
    }else{
      delete done[TAB][id];
    }
  }else{
    done[TAB][id]=Date.now();
  }
  saveDone();render();
  var el=document.getElementById("c-"+id);if(el)el.scrollIntoView({block:"center"});
}
function resetDone(t){if(confirm("重置该组背熟进度？")){done[t]={};saveDone();render()}}
function sw(t){
  TAB=t;FILTER=false;
  Object.keys(GROUPS).forEach(function(x){document.getElementById("tab-"+x).classList.toggle("on",x===t)});
  render();window.scrollTo(0,0);
}
function fsz(n){var s=parseInt(document.documentElement.style.fontSize||"17px")+n;s=Math.min(23,Math.max(14,s));document.documentElement.style.fontSize=s+"px";try{localStorage.setItem("sp-fs",s)}catch(e){}}
function th(){var k=document.documentElement.classList.toggle("dark");try{localStorage.setItem("sp-th",k?"1":"0")}catch(e){}}
try{var f=localStorage.getItem("sp-fs");if(f)document.documentElement.style.fontSize=f+"px";if(localStorage.getItem("sp-th")==="1")document.documentElement.classList.add("dark")}catch(e){}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=Object.keys(GROUPS).map(function(k){return '<button id="tab-'+k+'" onclick="sw(\''+k+'\')">'+GROUPS[k].name+'</button>'}).join("");
  TAB=Object.keys(GROUPS)[0];
  var ex=new Date("2026-10-24T09:00:00");
  var dd=Math.ceil((ex-new Date())/864e5);
  document.getElementById("cd").textContent="距架构师考试 "+dd+" 天";
  render();
})();
</script>

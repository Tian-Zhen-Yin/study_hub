<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub - 冒险者大厅</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link rel="stylesheet" href="shared/variables.css">
<link rel="stylesheet" href="shared/layout.css">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="components.css">
<style>
.material-body h2{font-size:18px;font-weight:700;margin:16px 0 8px;color:var(--primary-6)}
.material-body h3{font-size:15px;font-weight:600;margin:12px 0 6px;color:var(--text-1)}
.material-body p{margin:6px 0;line-height:1.7;font-size:14px}
.material-body ul,.material-body ol{margin:6px 0;padding-left:20px}
.material-body li{font-size:13px;line-height:1.8}
.material-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.material-body th,.material-body td{border:1px solid var(--border-2);padding:6px 10px;text-align:left}
.material-body th{background:var(--bg-surface-high);font-weight:600}
.material-body pre{background:var(--bg-surface-highest);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0}
.material-body code{font-family:monospace;font-size:13px}
.material-body .mermaid{display:flex;justify-content:center;margin:12px 0}
.material-body details{margin:8px 0;padding:8px 12px;background:var(--bg-surface-high);border-radius:6px}
.material-body summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--primary-6)}
.material-body blockquote{border-left:3px solid var(--primary-5);padding-left:12px;margin:8px 0;color:var(--text-2)}
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-topnav">
    <div class="topnav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>Study Hub</span>
    </div>
    <div class="topnav-hud">
      <div class="topnav-hud-item"><span class="hud-dot hp"></span> HP <strong id="hud-hp">100/100</strong></div>
      <div class="topnav-hud-item"><span class="hud-dot exp"></span> EXP <strong id="hud-exp">0/100</strong></div>
      <div class="topnav-hud-item"><span class="hud-dot coin"></span> <strong id="hud-coin">0</strong></div>
      <div class="topnav-hud-item" style="font-weight:700;color:var(--primary-6)" id="hud-level">Lv.1</div>
    </div>
  </header>
  <div class="app-body">
    <nav class="app-sidenav">
      <div class="sidenav-section"><div class="sidenav-section-title">大厅</div>
        <div class="sidenav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg>仪表盘</div></div>
      <div class="sidenav-section"><div class="sidenav-section-title">战斗</div>
        <div class="sidenav-item" data-page="quiz" onclick="navigate('quiz')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2l6 8H8l2 8-6-8h4L6 2z"/></svg>刷题战斗</div>
        <div class="sidenav-item" data-page="memory" onclick="navigate('memory')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2v4M10 14v4M2 10h4M14 10h4M4.93 4.93l2.83 2.83M12.24 12.24l2.83 2.83M4.93 15.07l2.83-2.83M12.24 7.76l2.83-2.83"/></svg>记忆熔炉</div>
        <div class="sidenav-item" data-page="simulation" onclick="navigate('simulation')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>全真模拟</div></div>
      <div class="sidenav-section"><div class="sidenav-section-title">分析</div>
        <div class="sidenav-item" data-page="diagnosis" onclick="navigate('diagnosis')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h14v14H3z"/><path d="M7 13l3-5 3 5"/></svg>弱点诊断</div>
        <div class="sidenav-item" data-page="plan" onclick="navigate('plan')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3h10v14H5z"/><path d="M8 7h4M8 11h4M8 15h2"/></svg>学习计划</div>
        <div class="sidenav-item" data-page="data" onclick="navigate('data')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="14" width="4" height="4" rx="1"/><rect x="8" y="8" width="4" height="10" rx="1"/><rect x="14" y="2" width="4" height="16" rx="1"/></svg>数据中心</div>        <div class="sidenav-item" data-page="bank" onclick="navigate('bank')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h12v12H4z"/><path d="M4 8h12M4 12h12M8 4v12"/></svg>题库管理</div></div>
      <div class="sidenav-section"><div class="sidenav-section-title">系统</div>
        <div class="sidenav-item" data-page="llm-settings" onclick="navigate('llm-settings')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.2 4.2l2.1 2.1M13.7 13.7l2.1 2.1M4.2 15.8l2.1-2.1M13.7 6.3l2.1-2.1"/></svg>AI 模型</div></div></nav>
    <main class="app-content" id="app-content"><div class="state-loading"><div class="spinner"></div><p>加载中...</p></div></main>
  </div>
  <footer class="app-bottombar">
    <div class="bottombar-item">距考试 <strong id="bottombar-days">--</strong> 天</div>
    <div class="bottombar-item">连续 <strong id="bottombar-streak" class="streak">0</strong> 天</div>
  </footer>
</div>
<script src="shared/app.js"></script>
<script src="shared/pages.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>

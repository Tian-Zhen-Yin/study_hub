<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>脑图·案例冲刺宝典 6.0.1（2026下）</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#222;--sub:#777;--line:#e3e5e9;--canvas:#eef0f4}
html.dark{--bg:#111418;--card:#1b1f24;--ink:#d8dce1;--sub:#8a919a;--line:#2a2f36;--canvas:#0d1013}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:5}
header b{font-size:1.05em}
.cd{font-size:.82em;color:var(--sub)}
.hbtn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:.85em;cursor:pointer}
.hbtn:hover{border-color:var(--acc,#dc2626);color:var(--acc,#dc2626)}
.hbtn.on{background:#dc2626;border-color:#dc2626;color:#fff}
#search{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:.9em;width:170px}
#hitinfo{font-size:.8em;color:var(--sub);min-width:44px}
#viewport{flex:1;overflow:hidden;position:relative;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px, var(--canvas);
cursor:grab;touch-action:none}
#viewport.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;left:0;top:0;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:5px 10px;max-width:270px;cursor:pointer;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.node:hover{border-color:var(--ink)}
.node .pg{display:inline-block;font-size:.72em;color:var(--sub);margin-left:6px}
.node .tag{display:inline-block;font-size:.7em;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.node .exam{display:inline-block;font-size:.66em;border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px;white-space:nowrap;font-weight:700}
.exam.old{background:#dcfce7;color:#15803d}
html.dark .exam.old{background:#052e16;color:#86efac}
.exam.new{background:#fef9c3;color:#a16207;border:1px dashed #d97706}
html.dark .exam.new{background:#422006;color:#fde047}
.fold{position:absolute;right:-9px;top:50%;transform:translateY(-50%);min-width:16px;height:16px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:10px;line-height:14px;text-align:center;padding:0 3px}
.node.collapsedkid{display:none}
.node.hit{outline:2px solid #f59e0b;outline-offset:1px}
.node.root{font-size:1.1em;font-weight:700;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.node.group{font-weight:700}
.lbl-super{border-left-color:#dc2626}
.lbl-super .tag{background:#fee2e2;color:#b91c1c}
html.dark .lbl-super .tag{background:#450a0a;color:#fca5a5}
.lbl-key{border-left-color:#d97706}
.lbl-key .tag{background:#fef3c7;color:#b45309}
html.dark .lbl-key .tag{background:#451a03;color:#fcd34d}
.lbl-minor{border-left-color:#2563eb}
.lbl-minor .tag{background:#dbeafe;color:#1d4ed8}
html.dark .lbl-minor .tag{background:#172554;color:#93c5fd}
.lbl-none{border-left-color:#94a3b8}
.lbl-none .tag{display:none}
/* ---------- 背诵清单 ---------- */
.tpill{display:inline-block;font-size:.68em;border-radius:5px;padding:0 5px;margin-left:5px;vertical-align:1px;font-weight:700}
.tpill.t1{background:#fee2e2;color:#b91c1c}
.tpill.t2{background:#fef3c7;color:#b45309}
.tpill.t3{background:#ede9fe;color:#6d28d9}
.tpill.ok{background:#dcfce7;color:#15803d}
html.dark .tpill.t1{background:#450a0a;color:#fca5a5}
html.dark .tpill.t2{background:#451a03;color:#fcd34d}
html.dark .tpill.t3{background:#2e1065;color:#c4b5fd}
html.dark .tpill.ok{background:#052e16;color:#86efac}
.node.ndone{border-color:#16a34a}
#plan{position:fixed;top:0;right:0;height:100%;width:330px;background:var(--card);border-left:1px solid var(--line);z-index:8;transform:translateX(105%);transition:transform .2s;overflow-y:auto;padding:12px 14px;box-shadow:-3px 0 10px rgba(0,0,0,.12)}
#plan.open{transform:none}
#plan h2{font-size:1em;margin:4px 0}
#plan .tier{font-weight:700;margin:12px 0 2px;font-size:.9em}
#plan .t1h{color:#dc2626}#plan .t2h{color:#d97706}#plan .t3h{color:#7c3aed}
#plan .ti{display:flex;gap:7px;align-items:flex-start;padding:6px 2px;border-bottom:1px dashed var(--line)}
#plan .ti input{margin-top:4px;flex:none}
#plan .ti label{cursor:pointer;flex:1;font-size:.88em}
#plan .ti.done label{color:var(--ok)}
#plan .ti .tip{display:block;font-size:.78em;color:var(--sub);line-height:1.5}
#plan .pg2{display:block;font-size:.75em;color:var(--sub);margin:6px 0 2px}
#tip{position:fixed;left:12px;bottom:10px;font-size:.75em;color:var(--sub);z-index:5;pointer-events:none}
</style>
</head>
<body>
<header>
  <b>🧠 案例冲刺宝典 6.0.1（2026下）</b><span class="cd">芝士架构 · 目录脑图</span>
  <span id="stats" class="cd"></span>
  <input id="search" type="search" placeholder="搜索节点…（/ 聚焦，回车跳转）">
  <span id="hitinfo"></span>
  <button class="hbtn" data-lv="1">到篇</button>
  <button class="hbtn on" data-lv="2">到章</button>
  <button class="hbtn" data-lv="3">到节</button>
  <button class="hbtn" data-lv="4">到小节</button>
  <button class="hbtn" data-lv="99">全展开</button>
  <button class="hbtn on" data-f="all">全部</button>
  <button class="hbtn" data-f="super">超级重点</button>
  <button class="hbtn" data-f="key">重点+</button>
  <button class="hbtn" data-f="minor">次重点</button>
  <button class="hbtn" id="zin">＋</button>
  <button class="hbtn" id="zout">－</button>
  <button class="hbtn" id="zfit">适配</button>
  <button class="hbtn" id="planBtn">📋 背诵清单</button>
  <button class="hbtn" id="theme">🌙</button>
</header>
<aside id="plan">
  <h2>📋 案例背诵清单（18 项）</h2>
  <div class="pbar" style="height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0"><i id="pfill" style="display:block;height:100%;background:#16a34a;width:0;transition:width .3s"></i></div>
  <span id="ptext" class="cd">已背 0/18</span>
  <button class="hbtn" id="planOnlyBtn" style="margin-left:8px">只看清单节点</button>
  <div id="planBody"></div>
</aside>
<div id="viewport"><div id="world"><svg id="links"></svg></div></div>
<div id="tip">拖拽平移 · 滚轮缩放 · 点击节点折叠/展开（右侧圆点=折叠的后代数）· 数据源：PDF 书签大纲 · <span class="exam old">绿=历年已考(年份)</span> · <span class="exam new">黄虚线=首考候选</span>（对账2018-2026架构师真题的Redis小节）</div>
<script>
const RAW = __DATA__;

/* ---------- 解析标题：剥离（重点★★★★★）标注 ---------- */
/* ---------- 解析标题：剥离（重点★★★★★）标注 ---------- */
/* Redis 相关小节考史标记(对账2018-2026架构师真题)：old=已考年份, new=首考候选 */
const EXAM_OLD = {'12.1.2':'22分片','13.1':'20·21','13.2':'20·25','13.3.1':'18','13.3.2':'25','13.3.2.1':'25','13.3.2.2':'25','13.4':'19·22·25','13.5':'5次(18-24)','13.6':'19·20','13.7':'19·20','13.9':'24·25·26','13.10':'22','13.12':'24·25','17.3':'26','17.4.3':'24','19.6':'26'};
const EXAM_NEW = {'13.3.3':'首考','13.3.3.1':'首考','13.3.4':'首考','13.3.5':'首考','13.8':'首考','13.8.1':'首考','13.8.2':'首考','13.11':'首考'};
function examBadge(t){
  const keys = Object.keys(EXAM_OLD).concat(Object.keys(EXAM_NEW)).sort((a,b)=>b.length-a.length);
  for(const k of keys){ if(t.startsWith(k+' ')){ return EXAM_OLD[k] ? {cls:'old',txt:'已考 '+EXAM_OLD[k]} : {cls:'new',txt:EXAM_NEW[k]+'候选'}; } }
  return null;
}
function parseTitle(it){
  let t = it.title, label = null, stars = '';
  const m = t.match(/（(超级重点|重点|次重点)([★☆]*)）/);
  if(m){ label = m[1]; stars = m[2]; t = t.slice(0, m.index) + t.slice(m.index + m[0].length); }
  t = t.replace(/^(\d+(?:\.\d+)*)\.\s*/, '$1 ').trim();
  return {title:t, label, stars, page: it.page==null? null : it.page+1, children:[], parent:null,
          collapsed:false, rendered:true, el:null, x:0,y:0,w:0,h:0,depth:0};
}

/* ---------- 建树（书签 depth 保证只增 1） ---------- */
const root = parseTitle({title:'案例冲刺宝典 6.0.1（2026下）', page:null});
root.isRoot = true;
let stack = [{d:0, node:root}];
for(const it of RAW){
  const n = parseTitle(it);
  while(stack.length>1 && stack[stack.length-1].d >= it.depth) stack.pop();
  const p = stack[stack.length-1].node;
  n.parent = p; p.children.push(n);
  stack.push({d:it.depth, node:n});
}

/* ---------- 前言子项归位：书签里「考试规则」等与章平级，降为前言的子节点 ---------- */
(function nestPreface(){
  const kids = root.children;
  const at = kids.findIndex(n => n.title === '前言');
  if(at < 0) return;
  const pre = kids[at];
  const moved = [];
  for(let i = at+1; i < kids.length; i++){
    const t = kids[i].title;
    if(/^\d+ /.test(t) || t.startsWith('上篇') || t.startsWith('下篇') || t === '后记') break;
    moved.push(kids[i]);
  }
  pre.children = moved.map(m => (m.parent = pre, m));
  root.children = kids.filter(n => n !== pre && !moved.includes(n));
  root.children.push(pre);
})();

/* ---------- 上篇/下篇分组（章级归拢，标题去掉"上篇-"/"下篇-"前缀） ---------- */
function group(prefix, gtitle){
  const picked = root.children.filter(c => new RegExp('^\\d+ '+prefix).test(c.title));
  if(!picked.length) return;
  const g = parseTitle({title:gtitle, page:null});
  g.isGroup = true;
  const at = root.children.indexOf(picked[0]);
  picked.forEach(c => {
    c.title = c.title.replace(new RegExp('^(\\d+) '+prefix+'-?'), '$1 ');
    c.parent = g; g.children.push(c);
  });
  root.children = root.children.filter(c => !picked.includes(c));
  g.parent = root; root.children.splice(Math.min(at, root.children.length), 0, g);
}
group('上篇','上篇 · 架构设计理论（第1-8章）');
group('下篇','下篇 · 技术与组件（第9-20章）');
root.children.sort((a,b)=> ord(a).localeCompare(ord(b)));
function ord(n){
  if(n.title==='前言') return '0';
  if(n.title.startsWith('上篇')) return '1';
  if(n.title.startsWith('下篇')) return '2';
  if(n.title.startsWith('后记')) return '3';
  return '1.5'; // 兜底
}
(function markDepth(n,d){ n.depth=d; n.children.forEach(c=>markDepth(c,d+1)); })(root,0);

/* ---------- 统计（分组节点不计入考点统计，但参与布局） ---------- */
const groups = root.children.filter(n => n.isGroup);
const all = [];
(function walk(n){ if(!n.isRoot && !n.isGroup) all.push(n); n.children.forEach(walk); })(root);
const pool = [root].concat(groups, all);

/* ---------- 背诵清单：18 项 × 三档（依据：书内星级 + 命题规律 + 真题考频） ---------- */
const CHECKLIST = [
  {tier:1, name:'九大质量属性＋场景六要素', tip:'每属性定义+战术各一句；六要素（刺激源/刺激/环境/制品/响应/响应度量）能现场写；ATAM 口诀"法师购柿树，惜抱栽结果"',
   nodes:['6.2 面向架构评估的质量属性','6.2.1 九大必考质量属性','6.3 质量属性场景描述','6.4 系统架构评估','6.5 ATAM方法的架构评估实践']},
  {tier:1, name:'软件架构风格', tip:'管道-过滤器/分层/C-S/B-S/事件驱动/微内核/仓库黑板：结构+优点+缺点+场景三件套',
   nodes:['6.1 软件架构风格']},
  {tier:1, name:'UML 建模（高频回归）', tip:'类图 5 次居案例第2题之首、近三次未出，回归概率最大：include/extend 方向区别、类图六关系强弱序、顺序图/活动图元素',
   nodes:['1.2 面向对象分析方法','1.2.2 用例图','1.2.3 类图','1.2.4 顺序图','1.2.5 通信图/协作图','1.2.6 活动图','1.2.7 常见图对比']},
  {tier:1, name:'DFD 与状态转换图', tip:'DFD 四种符号、父图子图平衡原则（数量守恒+分解一致）——第1题经典题型',
   nodes:['1.1 结构化分析','1.1.1 数据流图DFD','1.1.2 状态转换图']},
  {tier:1, name:'SOA 概念组', tip:'SOA 特征、ESB 作用、UDDI/WSDL/SOAP 各管什么、REST 约束——概念对比型高发',
   nodes:['5.1 什么是SOA','5.3 服务注册模式','5.3.2 UDDI、WSDL和SOAP','5.3.3 REST规范/风格','5.4 ESB模式']},
  {tier:1, name:'安全：加密与认证', tip:'对称 vs 非对称（算法举例+优缺点）、数字签名流程、混合加密、PKI/数字证书',
   nodes:['7.2 数据加密技术','7.3 认证技术']},
  {tier:1, name:'OO 设计原则', tip:'单一职责/开闭/里氏替换/依赖倒置/接口隔离/组合复用/迪米特：名字+一句解释+例子',
   nodes:['2.2 面向对象设计原则']},
  {tier:1, name:'云原生与容器', tip:'容器 vs 虚拟机对比表、云原生架构原则与模式',
   nodes:['4.1 云原生架构原则','4.2 云原生架构模式','4.4.1 容器和虚拟机对比']},
  {tier:2, name:'Redis 核心', tip:'两个超级重点：哨兵故障转移流程（按顺序背）、Redis 事务；缓存穿透/击穿/雪崩、RDB/AOF、缓存一致性、内存淘汰、热key大key、分布式锁',
   nodes:['13.1 数据类型','13.2 持久化机制','13.3 Redis集群','13.3.3.1 哨兵模式下故障转移流程','13.4 Redis常见生产问题','13.5 缓存和数据库一致性问题','13.7 内存淘汰策略','13.8 热Key和大Key问题','13.9 分布式锁','13.11 Redis事务']},
  {tier:2, name:'数据库优化与高可用', tip:'性能优化手段（索引/读写分离/分库分表）、主从复制/双机热备、关系型 vs NoSQL vs NewSQL 选型',
   nodes:['12.1 数据库性能优化','12.2 数据库高可用模式','12.3 数据库的选型']},
  {tier:2, name:'MongoDB', tip:'副本集角色（Primary/Secondary/Arbiter）、分片集群三组件（mongos/config/分片）',
   nodes:['15.2 分片集群','15.3 高可用（副本复制）']},
  {tier:2, name:'ElasticSearch', tip:'核心概念映射（Index≈表、Document≈行、分片/副本）、MySQL 同步四方案（双写/Canal/Logstash 等）',
   nodes:['14.2 ES 核心概念','14.4 MySQL与ES 数据同步']},
  {tier:3, name:'大模型 RAG / MCP / Agent', tip:'押题方向：RAG 全流程（分块→向量化→检索→重排→生成）+ 为什么用 RAG；MCP 解决什么；Agent 概念',
   nodes:['16.1 检索增强生成（RAG）','16.2 模型上下文协议协议（MCP）','16.3 智能体（AGENT）']},
  {tier:3, name:'CAP / BASE / 分布式事务', tip:'CAP 三选二取舍场景、BASE 三要素、2PC/3PC/TCC/本地消息表/SAGA 优缺点——薄弱档升二档',
   nodes:['11.1 CAP理论','11.2 CAP理论与系统实现','11.3 BASE理论','11.4 分布式事务理论解决方案']},
  {tier:3, name:'消息队列', tip:'三大作用（异步/解耦/削峰）+ 四大生产问题（丢失/重复/乱序/积压的对策）+ 常见 MQ 对比',
   nodes:['18.2 消息队列的作用','18.4 MQ 常见生产问题','18.6 常见 MQ 对比']},
  {tier:3, name:'秒杀架构', tip:'解决方案简述型满分模板：访问层→中间转发→服务层→Redis 扣库存→MQ→数据层，每层一个手段',
   nodes:['19.2 秒杀系统的整体架构','19.3 访问层设计','19.6 Redis 扣库存','19.7 消息队列层设计']},
  {tier:3, name:'Lambda vs Kappa', tip:'超级重点：两层批/流对比、Kappa 为何只需一层；批处理 vs 流处理差异',
   nodes:['8.2 批处理架构VS流处理架构','8.4.2 Lambda VS Kappa']},
  {tier:3, name:'MQTT 物联网', tip:'QoS 0/1/2 语义、Topic 通配符——物联网题唯一考点',
   nodes:['3.3.2 MQTT协议','3.3.2.3 MQTT中的QoS']},
];
const titleMap = {};
pool.forEach(n => titleMap[n.title] = n);
CHECKLIST.forEach((it, i) => {
  it.id = i;
  it._nodes = (it.nodes || []).map(t => titleMap[t]).filter(Boolean);
  it._nodes.forEach(n => n._item = it);
});
const planMissed = CHECKLIST.filter(it => it._nodes.length < (it.nodes||[]).length).map(it => it.name + ' ' + (it.nodes.length - it._nodes.length) + '个未命中');
let checked = new Set();
try{ checked = new Set(JSON.parse(localStorage.caseMindPlan || '[]')); }catch(e){}
let planOnly = false;
const cnt = {超级重点:0,重点:0,次重点:0,无标注:0};
all.forEach(n=>cnt[n.label||'无标注']++);
document.getElementById('stats').textContent =
  `${all.length} 个考点节点 · 超级重点 ${cnt['超级重点']} · 重点 ${cnt['重点']} · 次重点 ${cnt['次重点']} · 未标注 ${cnt['无标注']}`;

/* ---------- DOM 构建 ---------- */
const world = document.getElementById('world'), viewport = document.getElementById('viewport');
const svg = document.getElementById('links');
const lblCls = n => n.isRoot? 'root' : n.isGroup? 'group lbl-super' :
  (n.label==='超级重点'?'lbl-super':n.label==='重点'?'lbl-key':n.label==='次重点'?'lbl-minor':'lbl-none');
(function build(n){
  const el = document.createElement('div');
  el.className = 'node ' + lblCls(n);
  let html = n.title;
  if(n.label) html += `<span class="tag">${n.label}${n.stars?' '+n.stars:''}</span>`;
  if(n.exam) html += `<span class="exam ${n.exam.cls}">${n.exam.txt}</span>`;
  if(n.page!=null) html += `<span class="pg">P${n.page}</span>`;
  if(n._item) html += `<span class="tpill t${n._item.tier}">${'ⅠⅡⅢ'[n._item.tier-1]}</span>`;
  el.innerHTML = html;
  el._n = n; n.el = el;
  if(n.children.length){
    const f = document.createElement('span'); f.className='fold'; el.appendChild(f);
    el.addEventListener('click', e => { e.stopPropagation(); n.collapsed = !n.collapsed; render(); });
  } else {
    el.addEventListener('click', e => e.stopPropagation());
  }
  world.appendChild(el);
  n.children.forEach(build);
})(root);

/* ---------- 过滤：命中自身或有命中后代 ---------- */
let filterMode = 'all';
function passes(n){
  if(filterMode==='super') return n.label==='超级重点';
  if(filterMode==='key') return n.label==='超级重点'||n.label==='重点';
  if(filterMode==='minor') return n.label==='次重点';
  return true;
}
function computeRendered(){
  (function down(n, ancCol){
    let kidVisible = false;
    n.children.forEach(c=>{ down(c, ancCol || n.collapsed); if(c.rendered) kidVisible = true; });
    n._planOk = !n._item ? n.children.some(c=>c._planOk) : true;
    const planPass = !planOnly || n._item || n.children.some(c=>c._planOk);
    n.rendered = !ancCol && planPass && (filterMode==='all' ? true : (passes(n) || kidVisible));
    n._kids = n.children.filter(c=>c.rendered);
  })(root, false);
}

/* ---------- 布局（横排 tidy tree） ---------- */
const HGAP = 46, VGAP = 14;
function countAll(n){ return n.children.reduce((s,c)=>s+1+countAll(c),0); }
function layout(){
  computeRendered();
  const every = pool;
  every.forEach(n=> n.el.classList.toggle('collapsedkid', !n.rendered));
  const nodes = every.filter(n=>n.rendered);
  const colW = {};
  nodes.forEach(n=>{ colW[n.depth] = Math.max(colW[n.depth]||0, n.w); });
  const colX = {}; let acc = 30;
  Object.keys(colW).map(Number).sort((a,b)=>a-b).forEach(d=>{ colX[d] = acc; acc += colW[d] + HGAP; });
  let cursor = 30;
  function shift(n,dy){ n.y += dy; n._kids.forEach(k=>shift(k,dy)); }
  function place(n){
    if(!n._kids.length){
      n.y = cursor + n.h/2; cursor += n.h + VGAP;
    } else {
      const start = cursor;
      n._kids.forEach(place);
      const block = cursor - VGAP - start;
      if(n.h > block){
        const off = (n.h - block)/2;
        n._kids.forEach(k=>shift(k,off));
        cursor = start + n.h + VGAP;
      }
      n.y = (n._kids[0].y + n._kids[n._kids.length-1].y)/2;
    }
    n.x = colX[n.depth];
  }
  place(root);
  nodes.forEach(n=>{
    n.el.style.transform = `translate(${n.x}px,${n.y - n.h/2}px)`;
    const fold = n.el.querySelector('.fold');
    if(fold) fold.textContent = (n._kids.length < n.children.length) ? countAll(n) : '–';
  });
  /* 连线：按子节点优先级分色 */
  const dd = {super:'',key:'',minor:'',none:''};
  nodes.forEach(n=> n._kids.forEach(c=>{
    const x1=n.x+n.w, y1=n.y, x2=c.x, y2=c.y, mx=(x1+x2)/2;
    const k = c.label==='超级重点'?'super':c.label==='重点'?'key':c.label==='次重点'?'minor':'none';
    dd[k] += `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2} `;
  }));
  svg.innerHTML =
    `<path d="${dd.none}" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-opacity=".4"/>`+
    `<path d="${dd.minor}" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-opacity=".5"/>`+
    `<path d="${dd.key}"   fill="none" stroke="#d97706" stroke-width="1.8" stroke-opacity=".55"/>`+
    `<path d="${dd.super}" fill="none" stroke="#dc2626" stroke-width="2"   stroke-opacity=".6"/>`;
  let maxX=0, maxY=0;
  nodes.forEach(n=>{ maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h/2); });
  svg.setAttribute('width', maxX+60); svg.setAttribute('height', maxY+60);
  world.style.width = (maxX+60)+'px'; world.style.height = (maxY+60)+'px';
}
function measure(){
  world.style.width = '900px';  // 测量前先给可用宽度，否则 shrink-to-fit 逐字换行、高度全错
  pool.forEach(n=>{
    n.el.style.visibility='hidden';
    n.w = n.el.offsetWidth; n.h = n.el.offsetHeight;
    n.el.style.visibility='';
  });
}

/* ---------- 平移缩放 ---------- */
let z=1, px=40, py=20;
function applyT(){ world.style.transform = `translate(${px}px,${py}px) scale(${z})`; }
function fit(){
  const nodes = pool.filter(n=>n.rendered);
  if(nodes.length<2) return;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  nodes.forEach(n=>{ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y-n.h/2); maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h/2); });
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  z = Math.max(.3, Math.min(1, vw/(maxX-minX+80), vh/(maxY-minY+80)));
  px = (vw-(maxX-minX)*z)/2 - minX*z; py = (vh-(maxY-minY)*z)/2 - minY*z;
  applyT();
}
let dragging=false, lx=0, ly=0;
viewport.addEventListener('mousedown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; viewport.classList.add('drag'); });
window.addEventListener('mousemove', e=>{ if(!dragging) return; px+=e.clientX-lx; py+=e.clientY-ly; lx=e.clientX; ly=e.clientY; applyT(); });
window.addEventListener('mouseup', ()=>{ dragging=false; viewport.classList.remove('drag'); });
viewport.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = viewport.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
  const nz = Math.min(2.5, Math.max(.2, z * (e.deltaY<0? 1.12 : 1/1.12)));
  px = cx - (cx-px)*nz/z; py = cy - (cy-py)*nz/z; z = nz; applyT();
}, {passive:false});
document.getElementById('zin').onclick = ()=>{ z=Math.min(2.5,z*1.2); applyT(); };
document.getElementById('zout').onclick = ()=>{ z=Math.max(.2,z/1.2); applyT(); };
document.getElementById('zfit').onclick = ()=> fit();

/* ---------- 工具栏 ---------- */
document.querySelectorAll('[data-lv]').forEach(b=> b.onclick = ()=>{
  document.querySelectorAll('[data-lv]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  pool.forEach(n=> n.collapsed = n.depth >= +b.dataset.lv);
  render(); fit();
});
document.querySelectorAll('[data-f]').forEach(b=> b.onclick = ()=>{
  document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  filterMode = b.dataset.f; render();
});
document.getElementById('theme').onclick = function(){
  document.documentElement.classList.toggle('dark');
  const dark = document.documentElement.classList.contains('dark');
  this.textContent = dark? '☀️':'🌙';
  try{ localStorage.caseMindDark = dark?1:0; }catch(e){}
};
try{ if(localStorage.caseMindDark==1){ document.documentElement.classList.add('dark'); document.getElementById('theme').textContent='☀️'; } }catch(e){}

/* ---------- 搜索 ---------- */
const sbox = document.getElementById('search'), hitinfo = document.getElementById('hitinfo');
let hits=[], hitIdx=-1;
function centerOn(n){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  px = vw/2 - (n.x + n.w/2)*z; py = vh/2 - n.y*z; applyT();
}
sbox.addEventListener('input', ()=>{
  const q = sbox.value.trim().toLowerCase();
  pool.forEach(n=> n.el.classList.remove('hit'));
  hits = q? pool.filter(n=> !n.isRoot && n.title.toLowerCase().includes(q)) : [];
  if(q && filterMode!=='all'){       // 搜索时回到全量视图，避免被过滤隐藏
    filterMode='all';
    document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on', x.dataset.f==='all'));
  }
  if(q){
    hits.forEach(n=>{ let p=n.parent; while(p){ p.collapsed=false; p=p.parent; } });
    render();
    hits.forEach(n=> n.el.classList.add('hit'));
    hitIdx = hits.length? 0 : -1;
    if(hitIdx>=0) centerOn(hits[0]);
  }
  hitinfo.textContent = q? (hits.length? `${hits.length} 处` : '无匹配') : '';
});
sbox.addEventListener('keydown', e=>{
  if(e.key==='Enter' && hits.length){ hitIdx=(hitIdx+1)%hits.length; centerOn(hits[hitIdx]); hitinfo.textContent=`${hitIdx+1}/${hits.length}`; }
});
window.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==sbox){ e.preventDefault(); sbox.focus(); sbox.select(); }
});

/* ---------- 背诵清单面板 ---------- */
const planBtn = document.getElementById('planBtn'), planEl = document.getElementById('plan');
const planBody = document.getElementById('planBody'), pfill = document.getElementById('pfill'), ptext = document.getElementById('ptext');
planBtn.onclick = () => planEl.classList.toggle('open');
const tierName = {1:'第一档 · 必做题保命（上篇概念）', 2:'第二档 · 选做主战场（数据库/缓存）', 3:'第三档 · 趋势热点（押题防身）'};
(function buildPanel(){
  [1,2,3].forEach(t => {
    const h = document.createElement('div');
    h.className = 'tier t'+t+'h'; h.textContent = tierName[t];
    planBody.appendChild(h);
    CHECKLIST.filter(it=>it.tier===t).forEach(it => {
      const row = document.createElement('div');
      row.className = 'ti' + (checked.has(it.id)?' done':'');
      row.dataset.id = it.id;
      row.innerHTML = `<input type="checkbox" ${checked.has(it.id)?'checked':''}><label>${it.name}<span class="tip">${it.tip}</span></label>`;
      row.querySelector('input').addEventListener('change', e => {
        e.stopPropagation();
        if(e.target.checked) checked.add(it.id); else checked.delete(it.id);
        try{ localStorage.caseMindPlan = JSON.stringify([...checked]); }catch(err){}
        syncPlan();
      });
      row.querySelector('label').addEventListener('click', e => {
        e.preventDefault();   // 避免触发 checkbox 双态
        const n = it._nodes[0];
        if(!n) return;
        let p = n.parent;
        while(p){ p.collapsed = false; p = p.parent; }
        render(); centerOn(n);
      });
      planBody.appendChild(row);
    });
  });
})();
function syncPlan(){
  CHECKLIST.forEach(it => {
    const on = checked.has(it.id);
    it._nodes.forEach(n => {
      const p = n.el && n.el.querySelector('.tpill');
      if(p){ p.className = 'tpill ' + (on?'ok':'t'+it.tier); p.textContent = on?'✓':'ⅠⅡⅢ'[it.tier-1]; }
      if(n.el) n.el.classList.toggle('ndone', on);
    });
  });
  document.querySelectorAll('#plan .ti').forEach(row => {
    const on = checked.has(+row.dataset.id);
    row.classList.toggle('done', on);
    row.querySelector('input').checked = on;
  });
  pfill.style.width = (checked.size / CHECKLIST.length * 100) + '%';
  ptext.textContent = `已背 ${checked.size}/${CHECKLIST.length}`;
}
document.getElementById('planOnlyBtn').onclick = function(){
  planOnly = !planOnly;
  this.classList.toggle('on', planOnly);
  render();
};

/* ---------- 渲染入口 ---------- */
function render(){ layout(); applyT(); }
pool.forEach(n=> n.collapsed = n.depth >= 2);  // 默认展开到"章"
measure(); render(); syncPlan(); requestAnimationFrame(()=>fit());
if(planMissed.length) console.warn('清单节点未命中：', planMissed);
window.addEventListener('resize', ()=>fit());
</script>
</body>
</html>
